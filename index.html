 {date:'2.11.2026', q:"Canada da yaşayıp isimlerinde 'in' ifadesi geçen müşterileri bulma", lesson:'like',
  teacher:`SELECT CustomerName FROM Customers WHERE CustomerName LIKE '%in%' AND Country= 'Canada';`, note:'Doğru.',
  sol:`SELECT CustomerName FROM Customers WHERE CustomerName LIKE '%in%' AND Country = 'Canada';`},
 {date:'2.11.2026', q:'Fiyatı 40 ile 90 tl arasında olan ürünlerin isimleri ve fiyatları nelerdir?', lesson:'mantik',
  teacher:`SELECT ProductName FROM Product WHERE Price BETWEEN 40 AND 90;`, note:'İki sorun: tablo adı <code>Products</code> (çoğul) olmalı, ve soru fiyatları da istiyor, <code>Price</code> eksik.',
  sol:`SELECT ProductName, Price FROM Products WHERE Price BETWEEN 40 AND 90;`},
 {date:'2.11.2026', q:'Fiyatı 30 tlden büyük olan ürünlerin isimleri, fiyatlarını ve fiyatlarının karesini bulunuz', lesson:'hesap',
  teacher:'', note:'Notta bu sorunun çözümü boş kalmış. Çözüm 2. ve 3. konuda anlatıldı.',
  sol:`SELECT ProductName, Price, Price * Price AS fiyat_karesi FROM Products WHERE Price > 30;`},
 {date:'2.11.2026', q:"Products tablosundaki category_id'lerin yani kategori isimleri ne? (her ürünün adı ve kategori adı)", lesson:'join',
  teacher:`SELECT\nFROM Products\nLEFT JOIN Categories on Products.CategoryID = Categories.CategoryID;`, note:'SELECT\'ten sonrası notta görünmüyor. Ürün adı ve kategori adı yazılınca tamam. JOIN kısmı doğru.',
  sol:`SELECT Products.ProductName, Categories.CategoryName FROM Products LEFT JOIN Categories ON Products.CategoryID = Categories.CategoryID;`},
 {date:'2.11.2026', q:'Aşağıdakilerden hangisi bölüm alanını tabloya ekleyen kod? (Employees tablosuna Bolum alanını ekleyen kodu yaz)', lesson:'degistirme',
  teacher:'', note:'Soru çoktan seçmeli sorulmuş. Alan (sütun) eklemek = <code>ALTER TABLE ... ADD</code>. Hocanın Access dosyasında bunun kayıtlı cevabı var (sorgu adı ADDkomutu): <code>ALTER TABLE musteri ADD bolum char(15);</code>. 12. ve 13. konudaki çoktan seçmeli sorulara da bak.',
  sol:`ALTER TABLE Employees ADD Bolum TEXT;`, verify:`SELECT EmployeeID, Bolum FROM Employees;`},
 {date:'Sonraki ders', q:'beverages ürün kategorisindeki ürünlerin fiyat ortalaması nedir?', lesson:'join',
  teacher:`%%sql\nSELECT AVG(Price)\nFROM Products\nLEFT JOIN Categories on Products.CategoryID= categories.CategoryID\nWHERE CategoryNanem = 'Beverages';`, note:'<code>CategoryNanem</code> yazım hatası, <code>CategoryName</code> olmalı. <code>%%sql</code> Colab etiketi, burada yazma.',
  sol:`SELECT AVG(Price) FROM Products LEFT JOIN Categories ON Products.CategoryID = Categories.CategoryID WHERE CategoryName = 'Beverages';`},
 {date:'Sonraki ders', q:'USA da yaşayan müşterilerin kazandırdığı toplam kazancı bulunuz', lesson:'coklu-join',
  teacher:`SELECT SUM(p.Price)\nFROM Orders o\nLEFT JOIN OrderDetails od on o.OrderID = od.OrderID\nLEFT JOIN Products p on od.ProductID = p.ProductID\nLEFT JOIN Customers cu on o.CustomerID= cu.CustomerID where cu.Country = 'USA';`, note:'Doğru. Gerçek kazanç için <code>SUM(p.Price * od.Quantity)</code> daha doğru olurdu; soru adet demediği için hocanın hâli de kabul.',
  sol:`SELECT SUM(p.Price) FROM Orders o LEFT JOIN OrderDetails od ON o.OrderID = od.OrderID LEFT JOIN Products p ON od.ProductID = p.ProductID LEFT JOIN Customers cu ON o.CustomerID = cu.CustomerID WHERE cu.Country = 'USA';`},
 {date:'Sonraki ders', q:'product tablosundaki category_id\'lerin isimlerini bulunuz ve sonrasında kategori başına ortalama ürün fiyatını gösteriniz', lesson:'hepsi',
  teacher:`SELECT AVG(Price),CategoryName\nFROM Products\nLEFT JOIN Categories on Products.CategoryID = Categories.CategoryID\nGROUP BY CategoryName;`, note:'Doğru. "Kategori başına" = GROUP BY CategoryName.',
  sol:`SELECT AVG(Price), CategoryName FROM Products LEFT JOIN Categories ON Products.CategoryID = Categories.CategoryID GROUP BY CategoryName;`},
 {date:'Sonraki ders', q:'Çalışanları (employee) isimleri ile birlikte yaptıkları toplam satışlara göre sıralayınız', lesson:'hepsi', ordered:[1],
  teacher:`SELECT em.FirstName, SUM(p.Price) toplam_satis\nFROM Orders.o\nLEFT JOIN OrderDetails od on o.OrderID = od.OrderID\nLEFT JOIN Products p on od.ProductID =p.ProductID\nLEFT JOIN Employees em on o.EmployeeID= em.EmployeeID\nGROUP BY o.EmployeeID\nORDER BY toplam_satis DESC;`, note:'<code>FROM Orders.o</code> hatalı: takma ad boşlukla yazılır, <code>FROM Orders o</code>. <code>GROUP BY o.EmployeeID</code> bu veritabanında çalışır, ama SELECT\'te <code>em.FirstName</code> olduğu için <code>GROUP BY em.FirstName</code> yazmak daha temiz.',
  sol:`SELECT em.FirstName, SUM(p.Price) AS toplam_satis FROM Orders o LEFT JOIN OrderDetails od ON o.OrderID = od.OrderID LEFT JOIN Products p ON od.ProductID = p.ProductID LEFT JOIN Employees em ON o.EmployeeID = em.EmployeeID GROUP BY em.FirstName ORDER BY toplam_satis DESC;`},
 {date:'Sonraki ders', q:'Almanyadan verilen siparişlerin kategorilerine göre ort fiyatlar?', lesson:'hepsi',
  teacher:`SELECT ca.CategoryName, AVG(p.Price)\nFROM Orders o\nLEFT JOIN OrderDetails od on o.OrderID =od.OrderID\nLEFT JOIN Products p on od.ProductID =p.ProductID\nLEFT JOIN Categories ca on p.CategoryID= ca.CategoryID\nLEFT JOIN Customers cu on o.CustomerID=cu.CustomerID\nWHERE cu.Country = 'Germany' OR cu.Country = 'USA' GROUP BY CategoryName;`, note:'JOIN\'ler doğru. Ama soru sadece Almanya diyor, <code>OR cu.Country = \'USA\'</code> fazladan (muhtemelen deneme için eklenmiş). Sınavda soru ne diyorsa onu yaz.',
  sol:`SELECT ca.CategoryName, AVG(p.Price) FROM Orders o LEFT JOIN OrderDetails od ON o.OrderID = od.OrderID LEFT JOIN Products p ON od.ProductID = p.ProductID LEFT JOIN Categories ca ON p.CategoryID = ca.CategoryID LEFT JOIN Customers cu ON o.CustomerID = cu.CustomerID WHERE cu.Country = 'Germany' GROUP BY ca.CategoryName;`},
 {date:'Sonraki ders', q:'Haziran Temmuz Ağustos aylarında verilen siparişlerin ort fiyatı?', lesson:'like',
  teacher:`SELECT AVG(Products.Price)\nFROM Products\nLEFT JOIN OrderDetails on OrderDetails.ProductID =products.ProductID\nLEFT JOIN Orders on OrderDetails.OrderID=Orders.OrderID\nWHERE OrderDate like '%06%' or OrderDate like '%07%' or OrderDate like '%08%'`, note:'Doğru, ve bu veride aynı sonucu verir: tarihler <code>4.07.1996</code> biçiminde ve günler sıfırsız yazıldığı için <code>\'%07%\'</code> sadece ayı yakalar. Yine de en garantisi ayı noktalarla aramak: <code>\'%.07.%\'</code> (5. konudaki <code>\'%12%\'</code> örneğine bak; Aralık için aynı yöntem bozuluyor). Bu veride Haziran siparişi yok, sonuç Temmuz ve Ağustos 1996\'dan geliyor.',
  sol:`SELECT AVG(p.Price) FROM Orders o LEFT JOIN OrderDetails od ON o.OrderID = od.OrderID LEFT JOIN Products p ON od.ProductID = p.ProductID WHERE o.OrderDate LIKE '%.06.%' OR o.OrderDate LIKE '%.07.%' OR o.OrderDate LIKE '%.08.%';`},
 {date:'Sonraki ders', q:'Müşterilerin 1997 yılına ait siparişlerinin maks miktarlarını bulup müşterilerin isimleri ile birlikte b>k sırala', lesson:'hepsi', ordered:[1],
  teacher:`SELECT CustomerName, MAX(Price) maks\nFROM Products\nLEFT JOIN OrderDetails on Products.ProductID =OrderDetails.ProductID\nLEFT JOIN Orders on OrderDetails.OrderID=`, note:'Notta yarım kalmış. Tamamlanmış hâli: Customers tablosunu da bağla (müşteri adı için), 1997 için WHERE, müşteri başına MAX için GROUP BY, b&gt;k (büyükten küçüğe) için ORDER BY DESC. Hoca "maks" için <code>MAX(Price)</code> yazmış; "miktar" adet anlamında sorulursa <code>MAX(od.Quantity)</code> kullanılır.',
  sol:`SELECT cu.CustomerName, MAX(p.Price) AS maks FROM Orders o LEFT JOIN OrderDetails od ON o.OrderID = od.OrderID LEFT JOIN Products p ON od.ProductID = p.ProductID LEFT JOIN Customers cu ON o.CustomerID = cu.CustomerID WHERE o.OrderDate LIKE '%1997%' GROUP BY cu.CustomerName ORDER BY maks DESC;`},
 {date:'Sonraki ders', q:"(Soru metni notta yok. Koddan anlaşılan: 1997'de her çalışanın aldığı sipariş sayısı ve adı, çoktan aza.)", lesson:'hepsi', ordered:[0],
  teacher:`SELECT COUNT(*) n, em.FirstName\nFROM Orders\nSELECT ca.CategoryName, AVG(p.Price)\nFROM Orders o\nLEFT JOIN Employees em on Orders.EmployeeID=em.EmployeeID\nWHERE OrderDate like'%1997%'\nGROUP BY em.FirstName\nORDER BY n DESC;`, note:'İki ayrı sorgu birbirine karışmış: ortadaki <code>SELECT ca.CategoryName, AVG(p.Price)</code> ve <code>FROM Orders o</code> satırları başka bir sorudan. Onları silince sorgu çalışır.',
  sol:`SELECT COUNT(*) AS n, em.FirstName FROM Orders LEFT JOIN Employees em ON Orders.EmployeeID = em.EmployeeID WHERE OrderDate LIKE '%1997%' GROUP BY em.FirstName ORDER BY n DESC;`}
]},

body:`
<p class="lead">Hocanın tarzında yeni sorular. Konu anlatımı yok; her biri için önce tarifi uygula: hangi bilgiler lazım, hangi tablolarda, yol ne?</p>
<p class="tip">Takılırsan haritaya bak:</p>

tasks:[
 {q:'Seafood kategorisindeki ürünlerin ortalama fiyatı nedir?', sol:`SELECT AVG(p.Price) FROM Products p LEFT JOIN Categories ca ON p.CategoryID = ca.CategoryID WHERE ca.CategoryName = 'Seafood';`, hint:'Beverages sorusunun aynısı.'},
 {q:'Fransa\'daki (<code>France</code>) müşterilerin verdiği toplam sipariş sayısı.', sol:`SELECT COUNT(o.OrderID) FROM Orders o LEFT JOIN Customers cu ON o.CustomerID = cu.CustomerID WHERE cu.Country = 'France';`, hint:'Orders + Customers, COUNT, WHERE Country'},
 {q:'Her kargo firmasının adı ve taşıdığı sipariş sayısı.', sol:`SELECT sh.ShipperName, COUNT(o.OrderID) FROM Orders o LEFT JOIN Shippers sh ON o.ShipperID = sh.ShipperID GROUP BY sh.ShipperName;`, hint:'Orders + Shippers, GROUP BY ShipperName'},
 {q:'1996 yılında her çalışanın soyadı (<code>LastName</code>) ve aldığı sipariş sayısı, çoktan aza.', sol:`SELECT em.LastName, COUNT(*) AS n FROM Orders o LEFT JOIN Employees em ON o.EmployeeID = em.EmployeeID WHERE o.OrderDate LIKE '%1996%' GROUP BY em.LastName ORDER BY n DESC;`, ordered:[1], hint:"WHERE OrderDate LIKE '%1996%' ... GROUP BY ... ORDER BY ... DESC"},
 {q:'Kategori adlarına göre satılan toplam adet, çoktan aza.', sol:`SELECT ca.CategoryName, SUM(od.Quantity) AS adet FROM OrderDetails od LEFT JOIN Products p ON od.ProductID = p.ProductID LEFT JOIN Categories ca ON p.CategoryID = ca.CategoryID GROUP BY ca.CategoryName ORDER BY adet DESC;`, ordered:[1], hint:'Yol: OrderDetails → Products → Categories'},
 {q:'Ortalama ürün fiyatı 30\'dan yüksek olan kategorilerin adları ve ortalamaları.', sol:`SELECT ca.CategoryName, AVG(p.Price) FROM Products p LEFT JOIN Categories ca ON p.CategoryID = ca.CategoryID GROUP BY ca.CategoryName HAVING AVG(p.Price) > 30;`, hint:'Grup sonrası koşul: HAVING'},
 {q:'Brezilya\'dan verilen siparişlerdeki en pahalı ürünün fiyatı.', sol:`SELECT MAX(p.Price) FROM Orders o LEFT JOIN OrderDetails od ON o.OrderID = od.OrderID LEFT JOIN Products p ON od.ProductID = p.ProductID LEFT JOIN Customers cu ON o.CustomerID = cu.CustomerID WHERE cu.Country = 'Brazil';`, hint:'USA kazanç sorusu gibi, SUM yerine MAX.'},
 {q:'En çok harcama yapan (fiyat × adet) 5 müşterinin adı ve harcaması.', sol:`SELECT cu.CustomerName, SUM(p.Price * od.Quantity) AS harcama FROM Orders o LEFT JOIN OrderDetails od ON o.OrderID = od.OrderID LEFT JOIN Products p ON od.ProductID = p.ProductID LEFT JOIN Customers cu ON o.CustomerID = cu.CustomerID GROUP BY cu.CustomerName ORDER BY harcama DESC LIMIT 5;`, ordered:[1], hint:'SUM(p.Price * od.Quantity), GROUP BY müşteri, ORDER BY DESC, LIMIT 5'},
 {q:'Tedarikçisi Almanya\'da olan ürünlerin adları ve kategori adları.', sol:`SELECT p.ProductName, ca.CategoryName FROM Products p LEFT JOIN Suppliers s ON p.SupplierID = s.SupplierID LEFT JOIN Categories ca ON p.CategoryID = ca.CategoryID WHERE s.Country = 'Germany';`, hint:'Products\'a iki tablo bağlanıyor: Suppliers ve Categories. Ülke Suppliers\'ta.'},
 {q:'Nancy adlı çalışanın sipariş aldığı farklı müşteri sayısı.', sol:`SELECT COUNT(DISTINCT o.CustomerID) FROM Orders o LEFT JOIN Employees em ON o.EmployeeID = em.EmployeeID WHERE em.FirstName = 'Nancy';`, hint:'"Farklı" = COUNT(DISTINCT ...)'},
 {q:'1996\'nın son üç ayında (Ekim, Kasım, Aralık) verilen sipariş sayısı.', sol:`SELECT COUNT(*) FROM Orders WHERE OrderDate LIKE '%.10.1996' OR OrderDate LIKE '%.11.1996' OR OrderDate LIKE '%.12.1996';`, hint:"Üç LIKE, OR ile. '%10%' gibi yazarsan ayın 10'u, 11'i, 12'si de gelir; noktalarla ara: '%.10.1996'."},
 {q:'Her müşteri ülkesi için sipariş edilen ürünlerin ortalama fiyatı; sadece ortalaması 25\'ten büyük olanlar, büyükten küçüğe.', sol:`SELECT cu.Country, AVG(p.Price) AS ort FROM Orders o LEFT JOIN OrderDetails od ON o.OrderID = od.OrderID LEFT JOIN Products p ON od.ProductID = p.ProductID LEFT JOIN Customers cu ON o.CustomerID = cu.CustomerID GROUP BY cu.Country HAVING AVG(p.Price) > 25 ORDER BY ort DESC;`, ordered:[1], hint:'GROUP BY Country, HAVING AVG(...) > 25, ORDER BY ... DESC'}
]},

/* ---------------------------------------------------- 15 kopya */
{id:'kopya', no:'K', title:'Kopya kağıdı', group:'Sınava hazırlık',
body:`
<p class="lead">Sınavdan önce son tekrar için her şey tek sayfada.</p>
<div class="aside"><b>Hocanın son derste söyledikleri:</b> kelime açılımları sorulabilir (SQL vb.). <b>DDL, DML, DCL açılımları kesin soru.</b> DESC'i unutma. CREATE TABLE, ALTER TABLE ile sütun ekleme ve sütun silme.</div>
<div class="cheat">
<div style="grid-column:1/-1"><h4>Açılımlar (kesin soru)</h4><div class="tw" style="margin:0"><table class="ref"><tbody>
<tr><td><b>SQL</b></td><td>Structured Query Language</td><td>Yapılandırılmış Sorgu Dili</td></tr>
<tr><td><b>DDL</b></td><td>Data Definition Language</td><td>Veri Tanımlama Dili · CREATE, ALTER, DROP</td></tr>
<tr><td><b>DML</b></td><td>Data Manipulation Language</td><td>Veri İşleme Dili · INSERT, UPDATE, DELETE, SELECT</td></tr>
<tr><td><b>DCL</b></td><td>Data Control Language</td><td>Veri Kontrol Dili · GRANT, REVOKE</td></tr>
<tr><td><b>TCL</b></td><td>Transaction Control Language</td><td>İşlem Kontrol Dili · BEGIN, COMMIT, ROLLBACK</td></tr>
<tr><td><b>DBMS / RDBMS</b></td><td>(Relational) Database Management System</td><td>(İlişkisel) Veritabanı Yönetim Sistemi</td></tr>
<tr><td><b>PK / FK</b></td><td>Primary Key / Foreign Key</td><td>Birincil / Yabancı Anahtar</td></tr>
<tr><td><b>DESC / ASC</b></td><td>Descending / Ascending</td><td>Azalan / Artan</td></tr>
<tr><td><b>CRUD</b></td><td>Create, Read, Update, Delete</td><td>Oluştur, Oku, Güncelle, Sil</td></tr>
<tr><td><b>ACID</b></td><td>Atomicity, Consistency, Isolation, Durability</td><td>Bölünmezlik, Tutarlılık, Yalıtım, Kalıcılık</td></tr>
<tr><td><b>NoSQL</b></td><td>Not Only SQL</td><td>İlişkisel olmayan veritabanları</td></tr>
</tbody></table></div></div>
<div><h4>Teori özeti</h4><ul>
<li>PK: tekrar edemez, boş olamaz. FK: başka tablonun PK'sına başvurur.</li>
<li>İlişkiler: 1-1, 1-N (müşteri → siparişler), N-N (siparişler ↔ ürünler, ara tablo OrderDetails).</li>
<li>1NF: hücrede tek değer. 2NF: anahtarın tamamına bağlı. 3NF: başka sütuna bağlı değil.</li>
<li>Anomaliler: ekleme, güncelleme, silme.</li>
<li>NoSQL: anahtar-değer, belge, kolon, grafik.</li>
</ul></div>
<div><h4>Alt sorgu</h4><pre class="code">WHERE Price > (SELECT AVG(Price) FROM Products)
WHERE CategoryID IN (SELECT CategoryID FROM ...)
WHERE EXISTS (SELECT 1 FROM ... )
> ALL (...)  =  > (SELECT MAX(...))
> ANY (...)  =  > (SELECT MIN(...))</pre></div>
<div><h4>Temel kalıp ve sıra</h4><pre class="code">SELECT sütunlar
FROM tablo t
LEFT JOIN tablo2 t2 ON t.x = t2.x
WHERE koşul
GROUP BY sütun
HAVING fonksiyonlu_koşul
ORDER BY sütun DESC
LIMIT n;</pre></div>
<div><h4>WHERE işaretleri</h4><pre class="code">=  &lt;&gt;  &gt;  &lt;  &gt;=  &lt;=
AND  OR  NOT
Country IN ('Brazil','USA')
Price BETWEEN 40 AND 90
Name LIKE '%ha%'
x IS NULL / IS NOT NULL</pre><p>Metin tırnaklı, sayı tırnaksız. AND+OR varsa parantez.</p></div>
<div><h4>LIKE</h4><pre class="code">'C%'      C ile başlar
'%a'      a ile biter
'%in%'    içinde in geçer
'_a%'     2. harf a
'%1997%'     1997 yılı
'%.07.%'     Temmuz (her yıl)
'%.12.1996'  Aralık 1996
(tarih biçimi: 4.07.1996)</pre></div>
<div><h4>Fonksiyonlar</h4><pre class="code">COUNT(*)              satır sayısı
COUNT(DISTINCT col)   farklı değer sayısı
SUM(col)  AVG(col)
MIN(col)  MAX(col)
ROUND(AVG(col), 2)
Price * Price AS kare</pre></div>
<div><h4>GROUP BY</h4><p>"her ... için", "... başına", "...'e göre" → GROUP BY. SELECT'te fonksiyon dışındaki her sütun GROUP BY'da olmalı. Fonksiyonlu koşul HAVING'e, diğerleri WHERE'e.</p></div>
<div><h4>Tablo değiştirme</h4><pre class="code">ALTER TABLE t ADD Bolum TEXT;   -- sütun ekle
INSERT INTO t VALUES (...);    -- satır ekle
UPDATE t SET c = v WHERE ...;  -- değiştir
DELETE FROM t WHERE ...;       -- sil
CREATE TABLE t (id INTEGER PRIMARY KEY, ad TEXT);
ALTER TABLE t DROP sutun;       -- sütun sil
DROP TABLE t;                  -- tabloyu sil</pre></div>
<div><h4>UNION ve hileler</h4><pre class="code">SELECT a, b FROM t1
UNION            -- alt alta, tekrarsız
SELECT c, d FROM t2;   (UNION ALL: tekrarlı)

SELECT name FROM sqlite_master
  WHERE type = 'table';  -- tablolar
SELECT * FROM t WHERE 1 = 0;  -- sütunlar</pre></div>
<div style="grid-column:1/-1"><h4>JOIN haritası</h4>${MAP_HTML}</div>
<div><h4>Takma adlar (hocanın)</h4><pre class="code">Orders o        OrderDetails od
Products p      Categories ca
Customers cu    Employees em
Shippers sh     Suppliers s</pre><p>Boşlukla yazılır: <code>FROM Orders o</code>.</p></div>
<div><h4>Sık yapılan hatalar</h4><ul>
<li><code>Product</code> değil <code>Products</code></li>
<li><code>SELECT FROM</code>: arada ne istediğini yaz</li>
<li><code>COUNT(a, b)</code> değil <code>COUNT(a), b</code></li>
<li>Son sütundan sonra virgül yok</li>
<li><code>Country = 'Brazil' OR 'USA'</code> değil, sütunu tekrar yaz ya da IN</li>
<li><code>'%12%'</code> ayın 12'sini de yakalar; ay için <code>'%.12.%'</code></li>
<li>Access'teki <code>DELETE * FROM</code> burada <code>DELETE FROM</code></li>
<li>Fiyat tam sayı: <code>21 / 2</code> = 10, küsurat için <code>/ 2.0</code></li>
<li>Aynı sütun iki tabloda varsa <code>p.CategoryID</code> yaz</li>
</ul></div>
</div>`,
tasks:[]},

body:`
<p class="lead">Burası boş bir deneme alanı. Buradaki değişiklikler (ALTER, INSERT...) sen sıfırlayana kadar kalır; mesela önce bir tablo oluşturup sonra ayrı ayrı sorgulayabilirsin.</p>
<div id="playbox"></div>
<p><button id="playreset">Veritabanını baştan kur</button></p>
<h3>Tablolar ve sütunlar</h3>

/* =========================================================
   5) ARAYÜZ
   ========================================================= */
const ORDER = LESSONS.map(l=>l.id);
function taskId(l,i){ return l.id+'-'+i; }
function lessonCount(l){ const n=l.tasks.length; let s=0; l.tasks.forEach((t,i)=>{ if(SOLVED[taskId(l,i)]) s++; }); return [s,n]; }

/* ikonlar (Lucide çizgileri) */
const PATHS = {
  play:'<polygon points="7 4 20 12 7 20 7 4"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  checkc:'<circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/>',
  reset:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  bulb:'<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6M10 22h4"/>',
  table:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',
  eye:'<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
  book:'<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'
};
const ic = (n, cls='') => `<svg class="ic ${n==='play'?'fill ':''}${cls}" viewBox="0 0 24 24" aria-hidden="true">${PATHS[n]}</svg>`;

/* SQL renklendirme */
const KW = new Set('SELECT FROM WHERE AND OR NOT IN BETWEEN LIKE IS NULL AS ON JOIN LEFT RIGHT INNER OUTER FULL GROUP BY ORDER HAVING LIMIT DISTINCT ASC DESC INSERT INTO VALUES UPDATE SET DELETE CREATE TABLE ALTER ADD COLUMN DROP PRIMARY KEY AUTOINCREMENT UNION ALL INTEGER TEXT REAL VARCHAR CHAR DATE LONG INT DEFAULT CASE WHEN THEN ELSE END EXISTS DISTINCTROW'.split(' '));
const FN = new Set('COUNT SUM AVG MIN MAX ROUND STRFTIME LENGTH UPPER LOWER'.split(' '));
function highlight(src){
  const re=/(--[^\n]*|#[^\n]*)|('(?:[^']|'')*'?)|("[^"\n]*"?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_ÇĞİÖŞÜçğıöşü][\wÇĞİÖŞÜçğıöşü]*)|([\s\S])/g;
  let out='', m;
  while((m=re.exec(src))){
    const [tok,com,str,dq,num,word] = m;
    if(com) out+=`<span class="t-c">${esc(com)}</span>`;
    else if(str) out+=`<span class="t-s">${esc(str)}</span>`;
    else if(dq) out+=`<span class="t-s">${esc(dq)}</span>`;
    else if(num) out+=`<span class="t-n">${num}</span>`;
    else if(word){ const u=word.toUpperCase(); out += KW.has(u)?`<span class="t-k">${esc(word)}</span>` : FN.has(u)?`<span class="t-f">${esc(word)}</span>` : esc(word); }
    else out+=esc(tok);
  }
  return out;
}

function updateOverall(){
  let s=0,n=0; LESSONS.forEach(l=>{ const [a,b]=lessonCount(l); s+=a; n+=b; });
  document.getElementById('ovS').textContent=s; document.getElementById('ovN').textContent=n;
  const p = n? Math.round(s/n*100):0;
  document.getElementById('ovBar').style.width=p+'%';
  document.getElementById('ovBarWrap').setAttribute('aria-valuenow', p);
}

function buildNav(){
  const side=document.getElementById('side'), sel=document.getElementById('navsel');
  const cur = currentId();
  let h='', g=null, o='';
  for(const l of LESSONS){
    if(l.group!==g){ g=l.group; h+=`<div class="grp">${esc(g)}</div>`; o+= (o?'</optgroup>':'')+`<optgroup label="${esc(g)}">`; }
    const [s,n]=lessonCount(l), done = n && s===n;
    h += `<a href="#${l.id}" class="nv${l.id===cur?' on':''}${done?' done':''}"${l.id===cur?' aria-current="page"':''}><span class="nv-no">${done?ic('check'):esc(l.no)}</span><span class="nv-t">${esc(l.title)}</span><span class="nv-c">${n?`${s}/${n}`:''}</span></a>`;
    o += `<option value="${l.id}" ${l.id===cur?'selected':''}>${esc(l.no)} · ${esc(l.title)}${n?` (${s}/${n})`:''}</option>`;
  }
  side.innerHTML=h; sel.innerHTML=o+'</optgroup>';
  updateOverall();
}
document.getElementById('navsel').addEventListener('change', e=>{ location.hash = e.target.value; });

function currentId(){ const h=location.hash.slice(1); return ORDER.includes(h)?h:ORDER[0]; }

let edSeq=0;
function autosize(ta){ const lines=ta.value.split('\n').length; ta.rows=Math.max(3, Math.min(lines+1, 26)); }

/* Kod kutusu. opts: {code, id, task, play} */
function makeEditor(opts){
  const wrap=document.createElement('div'); wrap.className='ed';
  const id = opts.id || ('ed-'+(++edSeq));
  const t = opts.task;
  const draftKey = t ? 'draft.'+t.id : null;
  const initial = draftKey ? store.get(draftKey, opts.code||'') : (opts.code||'');
  wrap.innerHTML = `<div class="ed-head"><span class="lbl">SQL</span><span>${t?'senin cevabın':opts.play?'serbest alan · değişiklikler kalır':'örnek · değiştirip dene'}</span><span class="kh"><kbd>Ctrl</kbd>+<kbd>Enter</kbd>${t?' çalıştır · +<kbd>Shift</kbd> kontrol':' çalıştır'}</span></div>
   <div class="cw"><pre class="hl" aria-hidden="true"></pre><textarea id="${id}" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="SQL kodu" placeholder="${t?'-- sorgunu buraya yaz':''}"></textarea></div>
   <div class="bar">
     ${t ? `<button class="pri" data-a="check">${ic('checkc')}Kontrol et</button><button data-a="run">${ic('play')}Çalıştır</button>`
         : `<button class="pri" data-a="run">${ic('play')}Çalıştır</button>`}
     ${t&&t.hint?`<button class="ghost" data-a="hint">${ic('bulb')}İpucu</button>`:''}
     ${t?`<button class="ghost" data-a="exp">${ic('table')}Beklenen sonuç</button><button class="ghost" data-a="sol">${ic('eye')}Çözüm</button><button class="ghost" data-a="schema">${ic('book')}Tablolar</button>`:''}
     <span class="sp"></span>
     <button class="ghost" data-a="reset" title="${t?'Kutuyu temizle':'İlk hâline döndür'}">${ic('reset')}${t?'Temizle':'Sıfırla'}</button>
   </div>
   <div class="out" aria-live="polite"></div>`;
  const ta=wrap.querySelector('textarea'), hl=wrap.querySelector('pre.hl'), out=wrap.querySelector('.out');
  const paint = ()=>{ hl.innerHTML = highlight(ta.value) + (ta.value.endsWith('\n')||!ta.value?' ':''); hl.scrollLeft = ta.scrollLeft; };
  ta.value=initial; autosize(ta); paint();
  ta.addEventListener('input', ()=>{ autosize(ta); paint(); if(draftKey) store.set(draftKey, ta.value); });
  ta.addEventListener('scroll', ()=>{ hl.scrollLeft = ta.scrollLeft; });
  ta.addEventListener('keydown', e=>{
    if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); t&&e.shiftKey ? doCheck() : doRun(); }
  });
  async function doRun(){
    out.innerHTML='<div class="msg info">Çalışıyor…</div>';
    await READY;
    const code=ta.value; if(!code.trim()){ out.innerHTML='<div class="msg warn"><b>Kutu boş.</b> Önce bir sorgu yaz.</div>'; return; }
    let db = opts.play ? PLAY : fresh();
    const r = run(db, code); if(!opts.play) db.close();
    out.innerHTML = resultHtml(r);
  }
  async function doCheck(){
    out.innerHTML='<div class="msg info">Kontrol ediliyor…</div>';
    await READY;
    const code=ta.value; if(!code.trim()){ out.innerHTML='<div class="msg warn"><b>Kutu boş.</b> Önce sorgunu yaz.</div>'; return; }
    const exp=expected(t);
    if(!exp){ out.innerHTML='<div class="msg err">Bu sorunun kontrolü kurulamadı.</div>'; return; }
    const db=fresh(); const r=run(db, code); let uset=null, extra='';
    if(r.error){ db.close(); out.innerHTML = errorHtml(r.error) + '<div class="msg warn">Sorgu hata verdiği için kontrol edemedim. Hatayı düzeltip tekrar dene.</div>'; return; }
    if(t.verify){
      const v=run(db, t.verify);
      if(v.error){ db.close(); out.innerHTML=`<div class="msg warn"><b>Değişiklik bulunamadı.</b><p>Kontrol için <code>${esc(t.verify)}</code> çalıştırdım ama hata verdi: <code>${esc(v.error)}</code>. ${explainError(v.error)}</p></div>`; return; }
      uset=v.sets[v.sets.length-1]; extra = tableHtml(uset, 'Kontrol sorgusu: '+t.verify);
    } else { uset=r.sets[r.sets.length-1]; if(uset) extra=tableHtml(uset,'Senin sonucun'); }
    db.close();
    const c=compare(uset, exp, t.ordered);
    out.innerHTML = c.html + extra;
    if(c.ok){ markSolved(t.id); wrap.closest('.task')?.classList.add('solved'); refreshHead(); }
  }
  wrap.addEventListener('click', async e=>{
    const a=e.target.closest('button')?.dataset.a; if(!a) return;
    if(a==='run') doRun();
    else if(a==='check') doCheck();
    else if(a==='reset'){ ta.value = t ? '' : (opts.code||''); autosize(ta); paint(); if(draftKey) store.set(draftKey, ta.value); out.innerHTML=''; ta.focus(); }
    else if(a==='schema') toggleSchema(true);
    else if(a==='hint') out.innerHTML = `<div class="msg info"><b>İpucu:</b> ${esc(t.hint)}</div>`;
    else if(a==='sol') out.innerHTML = `<div class="msg info"><b>Örnek çözüm.</b> Aynı sonucu veren başka yazımlar da doğru sayılır.<pre class="code">${highlight(pretty(t.sol))}</pre></div>`;
    else if(a==='exp'){ await READY; const s=expected(t); out.innerHTML = s ? tableHtml(s, t.verify?'Beklenen (kontrol sorgusu: '+t.verify+')':'Beklenen sonuç') : ''; }
  });
  return wrap;
}

/* çözümleri okunur yap: anahtar kelimelerden önce satır başı */
function pretty(sql){
  if(sql.includes('\n')) return sql;
  return sql.replace(/\s+(FROM|LEFT JOIN|INNER JOIN|WHERE|GROUP BY|HAVING|ORDER BY|LIMIT|UNION ALL|UNION)\s/g, '\n$1 ').replace(/;\s+(?=\S)/g, ';\n');
}

function makeTask(l, t, i){
  t.id = taskId(l,i);
  const box=document.createElement('div'); box.className='task'+(SOLVED[t.id]?' solved':'');
  const num = i+1;
  const done = `<span class="chip done">${ic('check')}Çözüldü</span>`;
  if(t.mcq){
    box.innerHTML = `<div class="q"><span class="no">${num}</span><div class="txt"><div class="chips"><span class="chip">Çoktan seçmeli</span>${t.src?`<span class="chip src">${esc(t.src)}</span>`:''}${done}</div>${t.q}</div></div><div class="mcq">${t.options.map((o,k)=>`<button data-k="${k}">${String.fromCharCode(65+k)})&nbsp; ${esc(o)}</button>`).join('')}<div class="why" aria-live="polite"></div></div>`;
    box.querySelector('.mcq').addEventListener('click', e=>{
      const b=e.target.closest('button'); if(!b) return; const k=+b.dataset.k;
      box.querySelectorAll('.mcq button').forEach(x=>x.classList.remove('right','wrong'));
      const why=box.querySelector('.why');
      if(k===t.answer){ b.classList.add('right'); why.innerHTML=`<div class="msg ok"><b>Doğru.</b> ${t.explain}</div>`; markSolved(t.id); box.classList.add('solved'); refreshHead(); }
      else { b.classList.add('wrong'); why.innerHTML=`<div class="msg warn"><b>Bu değil.</b> Bir daha düşün.</div>`; }
    });
    return box;
  }
  let qhtml;
  if(l.teacher){
    const rel = LESSONS.find(x=>x.id===t.lesson);
    qhtml = `<div class="chips"><span class="chip src">${esc(t.date)}</span><a class="chip" href="#${t.lesson}">${ic('book')}${esc(rel.no)}. ${esc(rel.title)}</a>${done}</div><span class="orig">${esc(t.q)}</span>`;
  } else {
    qhtml = `<div class="chips">${t.src?`<span class="chip src">${esc(t.src)}</span>`:''}${done}</div>${t.q}${t.verify?`<span class="verify">Kontrol ederken senin kodundan sonra <code>${esc(t.verify)}</code> çalıştırılır.</span>`:''}`;
  }
  box.innerHTML = `<div class="q"><span class="no">${num}</span><div class="txt">${qhtml}</div></div>`;
  box.appendChild(makeEditor({task:t, id:'ed-'+t.id}));
  if(l.teacher){
    const rv=document.createElement('div'); rv.className='reveal';
    rv.innerHTML = `<button class="ghost" aria-expanded="false">${ic('eye')}<span>Hocanın çözümü ve notlar</span></button><div hidden>
      <p><b>Notta yazan:</b></p>${t.teacher?`<pre class="code">${highlight(t.teacher)}</pre>`:'<p><i>(boş)</i></p>'}
      <div class="aside"><b>Not:</b> ${t.note}</div>
      <p><b>Düzeltilmiş hâli:</b></p><pre class="code">${highlight(pretty(t.sol))}</pre>
      ${t.teacher&&!t.verify?`<button data-try>${ic('copy')}Hocanın yazdığını kutuya kopyala</button> <span class="src">hatayı kendin gör</span>`:''}
    </div>`;
    const btn=rv.querySelector('button'), body=rv.querySelector('div');
    btn.addEventListener('click', ()=>{ body.hidden=!body.hidden; btn.setAttribute('aria-expanded', String(!body.hidden)); btn.querySelector('span').textContent = body.hidden?'Hocanın çözümü ve notlar':'Gizle'; });
    rv.querySelector('[data-try]')?.addEventListener('click', ()=>{
      const ta=box.querySelector('textarea'); ta.value=t.teacher.replace(/^%%sql\n/,''); ta.dispatchEvent(new Event('input')); ta.focus();
    });
    box.appendChild(rv);
  }
  return box;
}

/* ders başlığındaki ilerlemeyi yeniden çiz */
function refreshHead(){
  const l=LESSONS.find(x=>x.id===currentId()); const [s,n]=lessonCount(l);
  const p=document.querySelector('.lprog'); if(!p) return;
  p.querySelector('i').style.width=(n?Math.round(s/n*100):0)+'%'; p.querySelector('span').textContent=`${s}/${n} çözüldü`;
}

function renderLesson(){
  const id=currentId(), l=LESSONS.find(x=>x.id===id), idx=ORDER.indexOf(id);
  const el=document.getElementById('lesson');
  const [s,n]=lessonCount(l);
  const eyebrow = /^\d+$/.test(l.no) ? `Konu ${l.no} · ${l.group}` : l.group;
  el.innerHTML = `<div class="lhead"><div class="eyebrow">${esc(eyebrow)}</div><h2>${esc(l.title)}</h2>${n?`<div class="lprog"><div class="bar-p"><i style="width:${Math.round(s/n*100)}%"></i></div><span>${s}/${n} çözüldü</span></div>`:''}</div><div class="body">${l.body}</div>`;
  let k=0;
  el.querySelectorAll('pre.ex').forEach(pre=>{
    const code=pre.textContent.replace(/^\n+/,'').replace(/\s+$/,'');
    pre.replaceWith(makeEditor({code, id:`ex-${l.id}-${++k}`}));
  });
  el.querySelectorAll('.body pre.code').forEach(p=>{ p.innerHTML = highlight(p.textContent); });
  if(l.play){
    document.getElementById('playbox').appendChild(makeEditor({code:'SELECT * FROM Orders LIMIT 10;', id:'play-ed', play:true}));
    const pr=document.getElementById('playreset'); pr.innerHTML = ic('reset')+'Veritabanını baştan kur';
    pr.addEventListener('click', async ()=>{ await READY; PLAY.close(); PLAY=new SQL.Database(BASE); document.querySelector('#playbox .out').innerHTML='<div class="msg ok"><b>Tamam.</b> Veritabanı ilk hâline döndü.</div>'; });
  }
  if(l.tasks.length){
    const sec=document.createElement('section'); sec.className='tasks';
    sec.innerHTML = `<div class="tasks-head"><h3>${l.teacher||l.id==='prova'?'Sorular':'Pratik'}</h3><span class="src">${l.tasks.length} soru</span></div><p class="lead" style="margin-top:10px">Hangi bilgi hangi tabloda diye takılırsan sağ alttaki <b>Tablolar</b> düğmesine bas, panel açık kalır. Sorguyu yaz, <b>Kontrol et</b>'e bas. Sütun adlarının ya da sütun sırasının farklı olması sorun değil; önemli olan gelen değerler.</p>`;
    l.tasks.forEach((t,i)=>sec.appendChild(makeTask(l,t,i)));
    el.appendChild(sec);
  }
  const prev=LESSONS[idx-1], next=LESSONS[idx+1];
  const pg=document.createElement('nav'); pg.className='pager'; pg.setAttribute('aria-label','Önceki ve sonraki konu');
  pg.innerHTML = `${prev?`<a href="#${prev.id}"><small>← Önceki</small>${esc(prev.title)}</a>`:''}${next?`<a class="nx" href="#${next.id}"><small>Sonraki →</small>${esc(next.title)}</a>`:''}`;
  el.appendChild(pg);
  if(SQL) fillDynamic();
}

/* veritabanı gerektiren parçalar */
function fillDynamic(){
  const tb = document.getElementById('tablolar') || document.getElementById('tablolar2');
  if(tb && !tb.dataset.done){
    const db=fresh(); let h='<div class="tw"><table class="ref"><thead><tr><th>Tablo</th><th>Ne tutar</th><th>Sütunlar</th></tr></thead><tbody>';
    for(const [name,[desc,cols]] of Object.entries(TABLE_INFO)){
      const cnt=db.exec(`SELECT COUNT(*) FROM ${name}`)[0].values[0][0];
      h += `<tr><td><code>${name}</code><br><span class="src">${cnt} satır</span></td><td>${esc(desc)}</td><td>${Object.entries(cols).map(([c,d])=>`<code>${c}</code> ${esc(d)}`).join('<br>')}</td></tr>`;
    }
    db.close(); tb.innerHTML = h+'</tbody></table></div>'; tb.dataset.done='1';
  }
  const gv=document.getElementById('gviz');
  if(gv && !gv.dataset.done){
    const db=fresh(); const r=db.exec(`SELECT Country, CustomerName FROM Customers WHERE Country IN ('Germany','Brazil','Canada') ORDER BY Country, CustomerName`)[0].values; db.close();
    const g={}; r.forEach(([c,n])=>(g[c]=g[c]||[]).push(n));
    gv.innerHTML = Object.entries(g).map(([c,ns])=>`<div class="box"><b>${esc(c)}</b>${ns.map(n=>`<span>${esc(n)}</span>`).join('')}<div class="sum">COUNT = ${ns.length}</div></div>`).join('')
      + `<p class="src" style="flex-basis:100%;margin:0">Diğer ülkeler de aynı şekilde kendi kutularında. Sonuçta her kutu tek satır olur: <code>Germany | ${g.Germany.length}</code>, <code>Brazil | ${g.Brazil.length}</code>...</p>`;
    gv.dataset.done='1';
  }
}

function tblHtml(list, keys){
  return list.map(([n,d,cols])=>`<div class="sc-tbl"><div class="sc-name">${n}${d?`<small>${d}</small>`:''}</div><div class="sc-cols">${cols.map(c=>`<span class="col${keys&&/ID$/.test(c)?' k':''}">${c}</span>`).join('')}</div></div>`).join('');
}
(function(){
  const panel=document.getElementById('schema'), fab=document.getElementById('schemaBtn');
  panel.innerHTML = `<div class="sc-head"><b>Tablolar ve sütunlar</b><button class="ghost" id="schemaX" aria-label="Paneli kapat">Kapat</button></div>

    <p class="sc-note">İki tabloyu bu ortak sütunla bağla. Zincir: Customers → Orders → OrderDetails → Products → Categories.</p>

  <details class="sc-sec"><summary>Bütün tablolar ve sütunları</summary>
    <p class="sc-note">Turuncu sütunlar numara sütunları, JOIN'de bunlar kullanılır.</p>${tblHtml(SCHEMA,true)}</details>
  <details class="sc-sec"><summary>Access dersi tabloları</summary>
    <p class="sc-note">13. konuda kullanılanlar.</p>${tblHtml(SCHEMA_ACCESS,false)}</details>`;
  fab.innerHTML = ic('table')+'<span>Tablolar</span>';
  window.toggleSchema = function(force){
    const open = force===undefined ? panel.hidden : force;
    panel.hidden = !open; fab.setAttribute('aria-expanded', String(open));
    fab.setAttribute('aria-label', open?'Tablolar panelini kapat':'Tablolar ve sütunlar panelini aç');
    store.set('schemaOpen', open);
  };
  fab.addEventListener('click', ()=>toggleSchema());
  document.getElementById('schemaX').addEventListener('click', ()=>toggleSchema(false));
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !panel.hidden) toggleSchema(false); });
  toggleSchema(!!store.get('schemaOpen', false));
})();
