<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sıfırdan SQL: tarayıcıda çalışan Northwind veritabanıyla konular, otomatik kontrol edilen pratikler ve vize soruları.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>SQL Vize Kampı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: üstte ilerleme bandı; altında solda konu menüsü, sağda tek sütun ders (metin ~70 karakter, kod kutuları biraz daha geniş).
   Kod kutuları her iki temada da koyu bir editör; SQL renklendirmesi teal anahtar kelime, amber fonksiyon, pembe metin, lila sayı. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --surface-2:#ecf1ef; --ink:#10201d; --muted:#53635f; --line:#d7e1de; --line-strong:#b9c8c4;
  --primary:#0f766e; --primary-ink:#ffffff; --primary-weak:#dcf0ec; --primary-hover:#0b5f58;
  --accent:#b45309; --accent-weak:#fbefdc;
  --ok:#15803d; --ok-weak:#e2f3e7; --err:#b91c1c; --err-weak:#fbe8e8; --info:#1d4ed8; --info-weak:#e7eef9;
  --code-bg:#0f1b1a; --code-head:#142322; --code-ink:#dbe7e4; --code-line:#223331; --code-muted:#87a09b; --caret:#5eead4;
  --tk-kw:#5eead4; --tk-fn:#fcd34d; --tk-str:#fda4af; --tk-num:#c4b5fd; --tk-com:#87a09b;
  --shadow:0 1px 2px rgba(16,32,29,.06), 0 6px 20px -8px rgba(16,32,29,.12);
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --font-display:"Bricolage Grotesque", "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-code:"JetBrains Mono", ui-monospace, Consolas, "Courier New", monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1312; --surface:#111c1a; --surface-2:#172422; --ink:#e2ebe8; --muted:#9db1ac; --line:#233430; --line-strong:#33504a;
  --primary:#2dd4bf; --primary-ink:#04201c; --primary-weak:#10332f; --primary-hover:#5eead4;
  --accent:#f5a524; --accent-weak:#33260f;
  --ok:#4ade80; --ok-weak:#10301d; --err:#f87171; --err-weak:#3a1616; --info:#93c5fd; --info-weak:#14223a;
  --code-bg:#08100f; --code-head:#0d1817; --code-line:#1b2b29;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b1312; --surface:#111c1a; --surface-2:#172422; --ink:#e2ebe8; --muted:#9db1ac; --line:#233430; --line-strong:#33504a;
  --primary:#2dd4bf; --primary-ink:#04201c; --primary-weak:#10332f; --primary-hover:#5eead4;
  --accent:#f5a524; --accent-weak:#33260f;
  --ok:#4ade80; --ok-weak:#10301d; --err:#f87171; --err-weak:#3a1616; --info:#93c5fd; --info-weak:#14223a;
  --code-bg:#08100f; --code-head:#0d1817; --code-line:#1b2b29;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-underline-offset:3px}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}

/* ---- üst band ---- */
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1220px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px;display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:42px;height:42px;border-radius:11px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;flex:none}
.logo .ic{width:22px;height:22px}
.brand h1{font-family:var(--font-display);font-size:1.45rem;line-height:1.1;margin:0;letter-spacing:-.015em}
.motto{display:block;font-family:var(--font-code);font-size:.74rem;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.motto .t-k{color:var(--primary)}
.motto .t-s{color:var(--accent)}
.overall{margin-left:auto;display:flex;flex-direction:column;gap:6px;min-width:min(100%,260px)}
.ov-line{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;color:var(--muted)}
.ov-line b{color:var(--ink);font-variant-numeric:tabular-nums}
.status{display:inline-flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.status.ready::before{background:var(--ok)}
.status.fail::before{background:var(--err)}
.bar-p{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar-p i{display:block;height:100%;width:0;background:var(--primary);border-radius:99px;transition:width .4s var(--ease)}

/* ---- düzen ---- */
.wrap{max-width:1220px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:28px 72px}
.layout{display:grid;grid-template-columns:268px minmax(0,1fr);gap:40px;align-items:start}
main{min-width:0;max-width:880px}

/* ---- menü ---- */
nav.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 32px);overflow:auto;padding:4px 6px 12px 0}
nav.side .grp{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:16px 10px 6px}
nav.side .grp:first-child{padding-top:2px}
.nv{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);color:var(--ink);text-decoration:none;font-size:.92rem;line-height:1.3;transition:background .15s}
.nv:hover{background:var(--surface-2)}
.nv-no{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-family:var(--font-code);font-size:.74rem;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.nv-t{flex:1;min-width:0}
.nv-c{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.nv.done .nv-no{background:var(--ok-weak);border-color:transparent;color:var(--ok)}
.nv.on{background:var(--primary-weak);font-weight:600}
.nv.on .nv-no{background:var(--primary);border-color:transparent;color:var(--primary-ink)}
#navsel{display:none;width:100%;font:inherit;font-size:1rem;padding:11px 12px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);margin-bottom:20px;min-height:46px}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)} nav.side{display:none} #navsel{display:block} .overall{margin-left:0;width:100%}}

/* ---- ders başlığı ---- */
.lhead{margin-bottom:26px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}
main h2{font-family:var(--font-display);font-size:clamp(1.8rem,1.3rem + 1.8vw,2.45rem);line-height:1.12;margin:6px 0 0;letter-spacing:-.02em;text-wrap:balance}
.lprog{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:.85rem;color:var(--muted);max-width:360px}
.lprog .bar-p{flex:1}
main h3{font-family:var(--font-display);font-size:1.32rem;line-height:1.25;margin:38px 0 10px;letter-spacing:-.01em;text-wrap:balance}
main p, main li{max-width:70ch}
main ul, main ol{padding-left:1.3em}
main li{margin:3px 0}
main li::marker{color:var(--primary)}
main :not(pre) > code{font-family:var(--font-code);font-size:.84em;background:var(--surface-2);border:1px solid var(--line);padding:1px 5px;border-radius:5px;word-break:break-word}
kbd{font-family:var(--font-code);font-size:.78em;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface);color:var(--ink)}
.lead{color:var(--muted);font-size:1.06rem;margin-top:0}

/* ---- bilgi kutuları ---- */
.tip, .aside{position:relative;padding:12px 16px 12px 46px;border-radius:var(--r-md);border:1px solid;margin:16px 0;max-width:72ch}
.tip{background:var(--primary-weak);border-color:color-mix(in srgb, var(--primary) 30%, transparent)}
.aside{background:var(--accent-weak);border-color:color-mix(in srgb, var(--accent) 35%, transparent)}
.tip::before, .aside::before{content:"";position:absolute;left:16px;top:15px;width:18px;height:18px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.tip::before{color:var(--primary);--m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5'/><path d='M9 18h6M10 22h4'/></svg>")}
.aside::before{color:var(--accent);--m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='m21.7 18-8-14a2 2 0 0 0-3.5 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3'/><path d='M12 9v4M12 17h.01'/></svg>")}

/* ---- statik kod ve tablolar ---- */
pre{font-family:var(--font-code);font-size:.86rem;line-height:1.6;margin:0}
pre.code{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:var(--r-md);overflow-x:auto;margin:12px 0;white-space:pre;tab-size:2}
pre.map{background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:16px;border-radius:var(--r-md);overflow-x:auto;font-size:.8rem;line-height:1.4;margin:12px 0}
.t-k{color:var(--tk-kw);font-weight:600}.t-f{color:var(--tk-fn)}.t-s{color:var(--tk-str)}.t-n{color:var(--tk-num)}.t-c{color:var(--tk-com);font-style:italic}
.tw{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);max-width:780px}
table.ref{border-collapse:collapse;font-size:.92rem;width:100%}
table.ref th, table.ref td{border-bottom:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
table.ref tr:last-child td{border-bottom:0}
table.ref th{background:var(--surface-2);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
table.ref td + td{border-left:1px solid var(--line)}

/* ---- butonlar ---- */
button{font:inherit;font-size:.88rem;font-weight:500;cursor:pointer;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:0 13px;min-height:36px;line-height:1.2;display:inline-flex;align-items:center;gap:7px;transition:background .15s, border-color .15s, color .15s, transform .1s;touch-action:manipulation}
button:hover{border-color:var(--primary);color:var(--primary)}
button:active{transform:scale(.97)}
button:focus-visible, a:focus-visible, textarea:focus-visible, select:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
button.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600}
button.pri:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:var(--primary-ink)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{background:var(--surface-2);color:var(--ink);border-color:transparent}
@media (pointer:coarse){button{min-height:44px}}

/* ---- kod editörü ---- */
.ed{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);margin:14px 0 22px;overflow:hidden;box-shadow:var(--shadow)}
.ed-head{display:flex;align-items:center;gap:10px;background:var(--code-head);color:var(--code-muted);font-size:.74rem;padding:7px 14px;border-bottom:1px solid var(--code-line)}
.ed-head .lbl{font-family:var(--font-code);font-weight:600;letter-spacing:.06em;color:var(--caret)}
.ed-head .kh{margin-left:auto;display:flex;gap:4px;align-items:center}
.ed-head kbd{background:transparent;color:var(--code-ink);border-color:var(--code-line)}
.cw{position:relative;background:var(--code-bg)}
.cw pre.hl, .cw textarea{margin:0;padding:14px 16px;font-family:var(--font-code);font-size:.9rem;line-height:1.6;white-space:pre;tab-size:2;letter-spacing:0;border:0;word-wrap:normal}
.cw pre.hl{position:absolute;inset:0;overflow:hidden;pointer-events:none;color:var(--code-ink)}
.cw textarea{position:relative;display:block;width:100%;background:transparent;color:transparent;caret-color:var(--caret);resize:none;overflow-x:auto;overflow-y:hidden;outline:none;min-height:3.4em}
.cw textarea::selection{background:rgba(94,234,212,.28);color:transparent}
.cw textarea::placeholder{color:var(--code-muted)}
.cw:focus-within{box-shadow:inset 0 0 0 2px var(--caret)}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.bar .sp{flex:1}
.out:empty{display:none}
.out{padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.res .meta{font-size:.78rem;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.res .scroll{overflow:auto;max-height:360px;border:1px solid var(--line);border-radius:var(--r-sm)}
.res table{border-collapse:collapse;font-family:var(--font-code);font-size:.78rem;font-variant-numeric:tabular-nums;min-width:100%}
.res th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;white-space:nowrap;color:var(--ink);box-shadow:inset 0 -1px 0 var(--line)}
.res th, .res td{padding:6px 12px;white-space:nowrap}
.res tbody tr:nth-child(even){background:color-mix(in srgb, var(--surface-2) 55%, transparent)}
.res tbody tr:hover{background:var(--primary-weak)}
.res td.n{text-align:right}
.res i.null{color:var(--muted)}

/* ---- mesajlar ---- */
.msg{position:relative;padding:10px 14px 10px 42px;border-radius:var(--r-md);font-size:.95rem;border:1px solid;line-height:1.55}
.msg p{margin:4px 0 0}
.msg::before{content:"";position:absolute;left:14px;top:12px;width:18px;height:18px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.msg > b:first-child{font-weight:700}
.msg.ok{background:var(--ok-weak);border-color:color-mix(in srgb, var(--ok) 40%, transparent)}
.msg.ok::before, .msg.ok > b:first-child{color:var(--ok)}
.msg.ok::before{--m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='m8 12 3 3 5-6'/></svg>")}
.msg.err{background:var(--err-weak);border-color:color-mix(in srgb, var(--err) 40%, transparent)}
.msg.err::before, .msg.err > b:first-child{color:var(--err)}
.msg.err::before{--m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='m15 9-6 6M9 9l6 6'/></svg>")}
.msg.warn{background:var(--accent-weak);border-color:color-mix(in srgb, var(--accent) 40%, transparent)}
.msg.warn::before, .msg.warn > b:first-child{color:var(--accent)}
.msg.warn::before{--m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='m21.7 18-8-14a2 2 0 0 0-3.5 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3'/><path d='M12 9v4M12 17h.01'/></svg>")}
.msg.info{background:var(--info-weak);border-color:color-mix(in srgb, var(--info) 30%, transparent)}
.msg.info::before{color:var(--info);--m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='M12 16v-4M12 8h.01'/></svg>")}
.msg pre.code{margin:8px 0 2px}

/* ---- pratik kartları ---- */
.tasks{margin-top:48px}
.tasks-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;border-top:2px solid var(--ink);padding-top:14px}
.tasks-head h3{margin:0}
.task{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);margin:18px 0;overflow:hidden;box-shadow:var(--shadow);transition:border-color .2s}
.task.solved{border-color:color-mix(in srgb, var(--ok) 45%, var(--line))}
.task .q{padding:16px 18px 14px;display:flex;gap:14px;align-items:flex-start}
.task .q .no{flex:none;width:32px;height:32px;border-radius:9px;background:var(--primary-weak);color:var(--primary);display:grid;place-items:center;font-family:var(--font-code);font-weight:600;font-size:.85rem}
.task.solved .q .no{background:var(--ok);color:var(--surface)}
.task .q .txt{min-width:0;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;letter-spacing:.02em;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.src{background:var(--accent-weak);color:var(--accent);border-color:transparent}
.chip.done{display:none;background:var(--ok-weak);color:var(--ok);border-color:transparent}
.chip .ic{width:12px;height:12px;stroke-width:3}
.task.solved .chip.done{display:inline-flex}
.task .ed{margin:0;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none}
.task .verify{display:block;font-size:.8rem;color:var(--muted);margin-top:6px}
.orig{font-size:1.05rem}
.orig::before{content:"“";color:var(--accent);font-family:var(--font-display);font-weight:700;margin-right:2px}
.orig::after{content:"”";color:var(--accent);font-family:var(--font-display);font-weight:700;margin-left:2px}
.mcq{display:flex;flex-direction:column;gap:8px;padding:0 18px 18px 64px}
.mcq button{text-align:left;font-family:var(--font-code);font-size:.84rem;font-weight:400;padding:10px 14px;min-height:44px;justify-content:flex-start;white-space:normal}
.mcq button.right{background:var(--ok-weak);border-color:var(--ok);color:var(--ink)}
.mcq button.wrong{background:var(--err-weak);border-color:var(--err);color:var(--ink)}
.mcq .why{font-size:.95rem}
.mcq .why:empty{display:none}
@media (max-width:560px){.mcq{padding-left:18px}}
.reveal{padding:12px 18px 16px;border-top:1px dashed var(--line-strong);font-size:.95rem;background:var(--surface)}
.reveal > div{margin-top:8px}
.reveal pre.code{margin:6px 0 12px}
.reveal p{margin:8px 0 4px}

/* ---- gruplama görseli ---- */
.gviz{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0}
.gviz .box{flex:1 1 200px;min-width:0;border:1.5px dashed color-mix(in srgb, var(--primary) 55%, transparent);border-radius:var(--r-md);padding:10px 14px;background:var(--surface)}
.gviz .box b{display:block;color:var(--primary);font-family:var(--font-display);font-size:1.05rem;margin-bottom:4px}
.gviz .box span{display:block;font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gviz .box .sum{margin-top:8px;font-family:var(--font-code);font-size:.85rem;font-weight:600;color:var(--ink);border-top:1px solid var(--line);padding-top:6px}
.src{font-size:.82rem;color:var(--muted)}

/* ---- sayfa altı ---- */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:52px}
.pager a{display:flex;flex-direction:column;gap:2px;padding:14px 18px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);text-decoration:none;color:var(--ink);font-weight:600;transition:border-color .15s}
.pager a:hover{border-color:var(--primary)}
.pager a small{font-size:.75rem;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pager .nx{text-align:right;grid-column:2}
@media (max-width:560px){.pager{grid-template-columns:1fr}.pager .nx{grid-column:1}}

/* ---- kopya kağıdı ---- */
.cheat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.cheat > div{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 16px;background:var(--surface);min-width:0}
.cheat h4{margin:4px 0 8px;font-family:var(--font-display);font-size:1.02rem}
.cheat pre.code{font-size:.78rem}
.cheat ul{padding-left:1.1em;font-size:.92rem}
#playreset{margin-top:4px}

/* ---- açılım kartları ---- */
.flashes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px;margin:14px 0 8px}
.flash{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow);transition:border-color .15s}
.flash summary{list-style:none;cursor:pointer;padding:16px 14px;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--font-code);font-weight:600;font-size:1.05rem;color:var(--primary)}
.flash summary::-webkit-details-marker{display:none}
.flash summary::after{content:"aç";font-family:var(--font-body);font-size:.72rem;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.flash[open]{border-color:var(--primary)}
.flash[open] summary{padding-bottom:6px}
.flash[open] summary::after{content:"kapat"}
.flash b{display:block;padding:0 14px;font-size:.92rem}
.flash span{display:block;padding:2px 14px 14px;font-size:.84rem;color:var(--muted)}

/* ---- Tablolar paneli (her sayfada, sağ altta) ---- */
.fab{position:fixed;right:max(16px, env(safe-area-inset-right, 0px));bottom:max(16px, env(safe-area-inset-bottom, 0px));z-index:30;min-height:46px;border-radius:99px;padding:0 20px;box-shadow:0 6px 20px -4px rgba(0,0,0,.35);font-weight:600}
#schema{position:fixed;right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(max(16px, env(safe-area-inset-bottom, 0px)) + 58px);z-index:30;width:min(400px, calc(100vw - 32px));max-height:min(74vh, 680px);overflow:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);box-shadow:0 14px 44px -10px rgba(0,0,0,.4);overscroll-behavior:contain}
.sc-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.sc-head b{font-family:var(--font-display);font-size:1.05rem;flex:1}
.sc-sec{padding:4px 16px 8px;border-bottom:1px solid var(--line)}
.sc-sec:last-child{border-bottom:0}
.sc-sec summary{cursor:pointer;font-weight:600;font-size:.9rem;padding:10px 0;list-style:none;display:flex;align-items:center;gap:8px;min-height:44px}
.sc-sec summary::-webkit-details-marker{display:none}
.sc-sec summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.sc-sec[open] summary::before{transform:rotate(45deg)}
.sc-note{font-size:.8rem;color:var(--muted);margin:0 0 8px;line-height:1.5}
table.lk{border-collapse:collapse;width:100%;font-size:.82rem;margin-bottom:6px}
table.lk td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.lk tr:last-child td{border-bottom:0}
table.lk td:first-child{color:var(--muted);padding-right:10px;width:42%}
.sc-tbl{margin:0 0 12px}
.sc-name{font-family:var(--font-code);font-weight:600;font-size:.88rem}
.sc-name small{font-family:var(--font-body);font-weight:400;color:var(--muted);margin-left:6px}
.sc-cols{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.col{font-family:var(--font-code);font-size:.72rem;padding:1px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.col.k{color:var(--accent);border-color:color-mix(in srgb, var(--accent) 45%, transparent);background:var(--accent-weak)}
.sc-join{font-family:var(--font-code);font-size:.74rem;line-height:1.9;margin:0 0 6px;overflow-x:auto;white-space:nowrap}
.sc-join i{font-style:normal;color:var(--muted)}
@media (max-width:560px){#schema{max-height:62vh}.fab span{display:none}.fab{padding:0 15px}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}

/* db.exec boş SELECT'lerde sütun başlığını da atıyor; o yüzden ifadeleri tek tek çalıştırıyoruz */
function run(db, sql){
  const sets=[]; let changes=0;
  try{
    for(const st of db.iterateStatements(sql)){
      const columns=st.getColumnNames(), values=[];
      while(st.step()) values.push(st.get());
      if(columns.length) sets.push({columns, values}); else changes=db.getRowsModified();
    }
    return {sets, changes};
  }catch(e){ return {error:String(e.message||e)}; }
}

function explainError(m){
  let x;
  if((x=m.match(/no such column: (.+)/))) return `<code>${esc(x[1])}</code> diye bir sütun bulunamadı. Yazımını kontrol et (sütun adları İngilizce: <code>CustomerName</code>, <code>Price</code>...). Bu sütun başka bir tablodaysa o tabloyu JOIN ile bağlaman gerekir. <code>p.Price</code> gibi takma ad kullandıysan, <code>p</code>'yi FROM ya da JOIN'de tanımladığından emin ol.`;
  if((x=m.match(/no such table: (.+)/))) return `<code>${esc(x[1])}</code> diye bir tablo yok. Tablolar: <code>Customers, Orders, OrderDetails, Products, Categories, Employees, Shippers, Suppliers</code>. Hepsi çoğul (sonunda s var), <code>Product</code> değil <code>Products</code>.`;
  if((x=m.match(/ambiguous column name: (.+)/))) return `<code>${esc(x[1])}</code> birden fazla tabloda var, hangisini kastettiğin belli değil. Başına tablo adını ya da takma adı koy: <code>Products.${esc(x[1])}</code> ya da <code>p.${esc(x[1])}</code>.`;
  if(/incomplete input/.test(m)) return `Sorgu yarım kalmış gibi görünüyor: kapanmamış bir parantez ya da tırnak olabilir, ya da sorgu bir anahtar kelimeyle bitiyor (<code>WHERE</code> yazıp koşulu yazmamak gibi).`;
  if((x=m.match(/unrecognized token: "(.+)"/))) return `<code>${esc(x[1])}</code> anlaşılamadı. Çoğunlukla açılıp kapanmayan bir tırnaktan olur: <code>'Germany'</code> iki tarafta da tek tırnak ister.`;
  if(/near "(ALL|ANY|SOME)": syntax error/.test(m)) return `Bu veritabanı (SQLite) <code>ANY</code> / <code>ALL</code> tanımıyor. Aynı anlamı şöyle yaz: <code>&gt; ALL (SELECT x ...)</code> yerine <code>&gt; (SELECT MAX(x) ...)</code>, <code>&gt; ANY (SELECT x ...)</code> yerine <code>&gt; (SELECT MIN(x) ...)</code>.`;
  if(/near "(DESC|DESCRIBE)": syntax error/.test(m)) return `<code>DESC tablo;</code> (DESCRIBE) MySQL komutu, SQLite'ta yok. Sütunları görmek için <code>PRAGMA table_info(tablo);</code> ya da <code>SELECT * FROM tablo WHERE 1 = 0;</code> yaz. Sıralamadaki DESC ise <code>ORDER BY</code>'dan sonra gelir: <code>ORDER BY Price DESC</code>.`;
  if(/FOREIGN KEY constraint failed/.test(m)) return `Yabancı anahtar (FOREIGN KEY) kuralı: başvurduğun değer diğer tabloda yok. Önce o kaydı ana tabloya eklemen gerekir.`;
  if(/near "\*": syntax error/.test(m)) return `<code>*</code> civarında yazım hatası. <code>DELETE * FROM ...</code> yazdıysan: bu Access'e özel bir yazım, burada (ve standart SQL'de) <code>DELETE FROM ...</code> yazılır. Değilse: <code>*</code> sadece <code>SELECT *</code>'da ya da iki sayının arasında (çarpma) kullanılır.`;
  if((x=m.match(/near "(.+?)": syntax error/))) return `<code>${esc(x[1])}</code> civarında yazım hatası var. Sık sebepler: kapanmamış parantez (<code>COUNT(CustomerID, Country</code> gibi), son sütundan sonra fazladan virgül, eksik virgül,<code>SELECT</code> ile <code>FROM</code> arasının boş kalması, anahtar kelimelerin sırasının yanlış olması (doğru sıra: SELECT, FROM, JOIN, WHERE, GROUP BY, HAVING, ORDER BY, LIMIT) ya da <code>Orders.o</code> gibi takma ad önüne nokta konması.`;
  if(/misuse of aggregate/.test(m)) return `COUNT, SUM, AVG gibi fonksiyonları WHERE içinde kullanamazsın. Gruplamadan sonra süzmek için <code>HAVING</code> kullan.`;
  if((x=m.match(/wrong number of arguments to function (\w+)/))) return `<code>${esc(x[1])}</code> fonksiyonuna yanlış sayıda şey verdin. Mesela <code>COUNT(CustomerID, Country)</code> olmaz; <code>COUNT(CustomerID), Country</code> yazmalısın (parantez sadece saydığın sütunu sarar).`;
  if((x=m.match(/no such function: (\w+)/))) return `<code>${esc(x[1])}</code> diye bir fonksiyon yok. Yazımını kontrol et.`;
  if(/duplicate column name/.test(m)) return `Bu isimde bir sütun tabloda zaten var.`;
  if((x=m.match(/table (\w+) already exists/))) return `<code>${esc(x[1])}</code> tablosu zaten var.`;
  if(/UNIQUE constraint failed|PRIMARY KEY/.test(m)) return `Aynı ID ile ikinci bir satır eklemeye çalıştın. PRIMARY KEY olan sütunda her değer tek olmalı.`;
  if(/Cannot add a NOT NULL column/.test(m)) return `Bu veritabanı (SQLite) sonradan eklenen bir sütunda NOT NULL'a ancak varsayılan değerle izin verir: <code>ADD tel VARCHAR(20) NOT NULL DEFAULT ''</code>. Access'te boş tabloya izin veriyordu.`;
  if(/aggregate functions are not allowed in the GROUP BY/.test(m)) return `GROUP BY içine fonksiyon yazılmaz; neye göre gruplayacaksan o sütunu yaz.`;
  return '';
}

/* ---- Sonuç karşılaştırma ---- */
const norm = v => v===null||v===undefined ? '∅' : typeof v==='number' ? String(Math.round(v*100)/100) : String(v).trim();
const rowKey = r => JSON.stringify(r);
function sameBag(A,B){ if(A.length!==B.length) return false; const a=A.map(rowKey).sort(), b=B.map(rowKey).sort(); return a.every((x,i)=>x===b[i]); }
function remapCols(U,E,nc){
  const sig = (M,j)=> M.map(r=>r[j]).sort().join('\u0001');
  const es=[...Array(nc).keys()].map(j=>sig(E,j)), us=[...Array(nc).keys()].map(j=>sig(U,j));
  const used=new Set(), map=[];
  for(let i=0;i<nc;i++){ const j=us.findIndex((s,k)=>!used.has(k)&&s===es[i]); if(j<0) return null; used.add(j); map.push(j); }
  return U.map(r=>map.map(j=>r[j]));
}
function compare(uset, eset, ordered){
  if(!uset) return {ok:false, html:`<div class="msg warn"><b>Sonuç tablosu yok.</b><p>Sorgun bir tablo döndürmedi. Bir <code>SELECT</code> sorgusu yazdığından emin ol.</p></div>`};
  const ec=eset.columns.length, uc=uset.columns.length;
  const E=eset.values.map(r=>r.map(norm)); let U=uset.values.map(r=>r.map(norm));
  if(uc!==ec){
    return {ok:false, html:`<div class="msg warn"><b>Sütun sayısı tutmuyor.</b><p>Beklenen sonuçta ${ec} sütun var, seninkinde ${uc}. Soru tam olarak hangi bilgileri istiyor, tekrar oku. ${uc>ec?'Fazladan sütun seçmiş olabilirsin (mesela <code>*</code> yerine sadece istenen sütunları yaz).':'Eksik sütun var.'}</p></div>`};
  }
  if(U.length!==E.length){
    let why = '';
    if(U.length===0) why='Hiç satır dönmedi. Tırnak içindeki değerlerin yazımını kontrol et (<code>\'Germany\'</code>, <code>\'USA\'</code>, <code>\'Beverages\'</code>), LIKE kalıbında % işaretlerini unutmuş olabilirsin.';
    else if(U.length>E.length) why='Fazla satır geldi. Bir koşul eksik olabilir, ya da GROUP BY / DISTINCT / LIMIT gerekiyor olabilir.';
    else why='Eksik satır geldi. Koşulun fazla sıkı olabilir, ya da gruplaman fazla ayrıntılı (gereğinden çok sütuna göre GROUP BY) olabilir.';
    return {ok:false, html:`<div class="msg warn"><b>Satır sayısı tutmuyor.</b><p>Beklenen ${E.length} satır, sende ${U.length} satır var. ${why}</p></div>`};
  }
  if(!sameBag(U,E)){
    const R2 = remapCols(U,E,ec);
    if(R2 && sameBag(R2,E)) U=R2;
    else {
      const have=new Set(U.map(rowKey)); const miss=E.find(r=>!have.has(rowKey(r)));
      return {ok:false, html:`<div class="msg warn"><b>Satır ve sütun sayısı doğru, ama değerler farklı.</b><p>Hesapladığın şey ya da süzdüğün satırlar biraz farklı olabilir (SUM yerine AVG, Price yerine Price*Quantity, yanlış ülke gibi).${miss?` Beklenen sonuçta olup sende olmayan bir satır: <code>${esc(miss.map(v=>v==='∅'?'NULL':v).join(' | '))}</code>`:''}</p></div>`};
    }
  }
  if(ordered){
    const key = r => JSON.stringify(ordered.map(i=>r[i]));
    for(let i=0;i<E.length;i++) if(key(U[i])!==key(E[i]))
      return {ok:false, html:`<div class="msg warn"><b>Değerler doğru, sıralama farklı.</b><p>Soru bir sıralama istiyor. <code>ORDER BY</code> kullandın mı? Büyükten küçüğe için sonuna <code>DESC</code> ekle.</p></div>`};
  }
  return {ok:true, html:`<div class="msg ok"><b>Doğru!</b> Sonucun beklenen sonuçla birebir aynı.</div>`};
}
const EXP_CACHE = {};
function expected(t){
  if(EXP_CACHE[t.id]) return EXP_CACHE[t.id];

  if(!r.error){ if(t.verify){ const v=run(db,t.verify); set=v.error?null:v.sets[v.sets.length-1]; } else set=r.sets[r.sets.length-1]; }
  db.close();
  return EXP_CACHE[t.id]=set;
}

{id:'baslangic', no:'0', title:'Başlarken', group:'Temel',
body:`
<p class="lead">SQL'i hiç bilmiyorsan doğru yerdesin. Adım adım gideceğiz; sonunda hocanın derste verdiği soruların hepsini kendin çözebileceksin.</p>
<h3>Veritabanı = birbirine bağlı Excel sayfaları</h3>
<p>Bir veritabanını içinde birkaç sayfa olan bir Excel dosyası gibi düşün:</p>
<ul>
<li><b>Tablo</b>: bir konunun listesi. Mesela <code>Customers</code> (müşteriler).</li>
<li><b>Satır</b> (kayıt): listedeki tek bir şey. Bir müşteri = bir satır.</li>
<li><b>Sütun</b> (alan): her satırda tutulan bilgi. <code>CustomerName</code>, <code>City</code>, <code>Country</code>...</li>
</ul>
<p><b>SQL</b> bu tablolara soru sorma dili. "Almanya'daki müşterileri getir" cümlesini SQL ile yazarsın, veritabanı cevabı yine bir tablo olarak verir.</p>
<h3>İlk sorgunu çalıştır</h3>
<p>Aşağıdaki kutu bir kod kutusu. <b>Çalıştır</b>'a bas (ya da kutunun içindeyken <kbd>Ctrl</kbd>+<kbd>Enter</kbd>). Kodu istediğin gibi değiştirebilirsin; bozarsan <b>Sıfırla</b>.</p>
<pre class="ex">SELECT * FROM Customers;</pre>
<p>Bu "Customers tablosundaki her şeyi getir" demek. Gördüğün her satır bir müşteri. <code>Customers</code> yerine <code>Orders</code> ya da <code>Products</code> yazıp tekrar çalıştır.</p>
<h3>Hocanın kullandığı veritabanı: Northwind</h3>
<p>Hocanın soruları <b>Northwind</b> adlı örnek veritabanı üzerinde. Bir gıda toptancısı düşün: müşterileri var, sipariş alıyor, siparişlerde ürünler var, ürünlerin kategorisi var. Buradaki veri, hocanın dönem başında attığı <code>sql_veri_setleri.zip</code>'teki CSV dosyalarının <b>aynısı</b>. Yani sonuçların hocanın Colab'ındakiyle aynı çıkması lazım.</p>
<p>Bu veride bilmen gereken iki tuhaflık var:</p>
<ul>
<li><b>Tarihler <code>4.07.1996</code> biçiminde</b> (gün.ay.yıl, günün başında sıfır yok). Siparişler sadece 4.07.1996 ile 12.02.1997 arasında. Hocanın <code>LIKE '%1997%'</code> yazmasının sebebi bu: yıl sonda.</li>
<li><b>Fiyatlar tam sayı</b> (21.35 değil 21). Bunun bir bölme tuzağı var, 2. konuda göreceğiz.</li>
</ul>
<div id="tablolar"></div>
<h3>Tablolar birbirine nasıl bağlı?</h3>
<p>Bu kısım JOIN konusunda çok önemli olacak, şimdilik göz atman yeter. Tablolar ortak sütunlar üzerinden bağlı: bir siparişin (<code>Orders</code>) hangi müşteriye ait olduğu <code>CustomerID</code> sütunundan anlaşılır.</p>
${MAP_HTML}
<h3><code>%%sql</code> ne? Colab'da kurulum</h3>
<p>Hocanın kodlarının başındaki <code>%%sql</code>, Colab'a (ya da Jupyter'e) "bu hücre Python değil SQL" demenin yolu. SQL'in parçası değil. Burada yazmana gerek yok, Colab'da yazman gerekiyor.</p>
<p>Hocanın 23 Mart dersindeki kurulum üç hücre:</p>
<pre class="code">!pip install ipython-sql        # 1) SQL eklentisini kur (bir kere)

%load_ext sql                   # 2) eklentiyi aç

%%sql
sqlite:///ist.db                # 3) veritabanı dosyasına bağlan</pre>
<p>Hocanın notunda <code>load_ext sql</code> başında % olmadan da yazılmış; Jupyter onu da kabul ediyor. Bağlandıktan sonra her SQL hücresinin başına <code>%%sql</code> yazıp sorguyu altına yazarsın:</p>
<pre class="code">%%sql
SELECT * FROM Products LIMIT 10;</pre>
<p>Hocanın sınıfta kullandığı diğer araç <b>DB Browser for SQLite</b> (<code>.sqbpro</code> ve <code>.db</code> dosyaları onun). Orada "Execute SQL" sekmesine aynı sorguları <code>%%sql</code> olmadan yazarsın, bu sitedeki gibi.</p>
<h3>Bu siteyle nasıl çalışmalı?</h3>
<ol>
<li>Konuyu oku, örnek kutularını çalıştır ve <b>bir yerini değiştirip</b> tekrar çalıştır. En hızlı böyle öğrenilir.</li>
<li>Her konunun sonunda <b>Pratik</b> soruları var. Sorguyu yaz, <b>Kontrol et</b>'e bas. Site senin sonucunu doğru sonuçla karşılaştırır ve neyin tutmadığını söyler.</li>
<li>Takılırsan önce <b>İpucu</b>, olmazsa <b>Çözümü göster</b>.</li>
<li>Çözdüğün sorular sol menüde sayılır. Bu bilgi sadece senin tarayıcında durur, arkadaşların kendi ilerlemesini görür.</li>
</ol>
<p class="tip">Sıra önerisi: 1'den 15'e kadar konuları sırayla bitir (14. konu teori ve açılımlar, hocanın "kesin soru" dediği yer), sonra <b>Hocanın soruları</b>'na geç, en son <b>Sınav provası</b>. Sınavdan önce <b>Kopya kağıdı</b>'na bir göz at.</p>`,
tasks:[]},
