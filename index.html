{id:'select', no:'1', title:'SELECT ve FROM', group:'Temel',
body:`
<p class="lead">Her sorgu iki soruya cevap verir: <b>neyi</b> istiyorsun, <b>nereden</b>?</p>
<pre class="code">SELECT sütunlar
FROM tablo;</pre>
<ul><li><code>SELECT</code>: "şu sütunları göster"</li><li><code>FROM</code>: "şu tablodan"</li><li><code>;</code>: komut bitti</li></ul>
<h3>Yıldız = bütün sütunlar</h3>
<pre class="ex">SELECT * FROM Products;</pre>
<h3>İstediğin sütunları seç</h3>
<p>Sütun adlarını aralarına virgül koyarak yaz. Hangi sırayla yazarsan sonuç o sırayla gelir.</p>
<pre class="ex">SELECT ProductName, Price FROM Products;</pre>
<p>Dene: <code>Price</code>'ı başa al, ya da araya <code>Unit</code> ekle.</p>
<h3>Kafa karıştıran küçük şeyler</h3>
<ul>
<li><b>Satır atlamak serbest.</b> <code>SELECT ...</code> ve <code>FROM ...</code> ayrı satırlarda olabilir. Hoca da öyle yazıyor, okuması kolay.</li>
<li><b>Büyük/küçük harf:</b> <code>select</code> ile <code>SELECT</code> aynı. Bu veritabanında tablo adlarında da fark etmez (hoca bazen <code>products</code> yazıyor, çalışıyor). Ama tırnak içindeki <b>değerlerde</b> fark eder; onu WHERE'de göreceğiz.</li>
<li><b>Son sütundan sonra virgül yok.</b> <code>SELECT ProductName, Price, FROM ...</code> hata verir.</li>
<li><b>Tablo adları çoğul:</b> <code>Products</code>, <code>Customers</code>, <code>Orders</code>. <code>Product</code> yazarsan "no such table" hatası alırsın. (Hocanın bir çözümünde tam bu hata var.)</li>
</ul>
<p>Bilerek hatalı bir sorgu çalıştır ve sitenin ne dediğine bak. Sonra iki hatayı da düzelt:</p>
<pre class="ex">SELECT ProductName, Price, FROM Product;</pre>
<h3>LIMIT: sadece ilk birkaç satır</h3>
<p>Hocanın 23 Mart dersindeki ilk sorgu buydu. Tablo büyükse hepsini görmek yerine ilk 10 satıra bakarsın:</p>
<pre class="ex">SELECT * FROM Products LIMIT 10;</pre>
<h3>Hocanın iki işe yarar hilesi</h3>
<p><b>Veritabanında hangi tablolar var?</b> SQLite her tablonun adını <code>sqlite_master</code> adlı gizli bir tabloda tutar:</p>
<pre class="ex">SELECT name FROM sqlite_master WHERE type = 'table';</pre>
<p>(Burada Northwind tablolarının yanında Access dersindeki <code>musteri</code>, <code>siparis</code> gibi tablolar da görünecek; 13. konuda onları kullanacağız.)</p>
<p><b>Bir tablonun sütun adları ne?</b> Hiçbir zaman doğru olmayan bir koşul yazarsan satır gelmez, ama sütun başlıkları gelir:</p>
<pre class="ex">SELECT * FROM Customers WHERE 1 = 0;</pre>
<p>1 hiçbir zaman 0'a eşit olmadığı için hiçbir satır seçilmez. Bir soruyu çözmeden önce sütun adlarını hatırlamak için çok kullanışlı.</p>`,
tasks:[
 {q:'<code>Customers</code> tablosunun ilk 3 kaydı.', src:'Hocanın 23 Mart dersi', sol:`SELECT * FROM Customers LIMIT 3;`, hint:'SELECT * ... LIMIT 3'},
 {q:'Müşterilerin <code>CustomerID</code> ve <code>City</code> bilgisi, ilk 3 kayıt.', src:'Hocanın 23 Mart dersi', sol:`SELECT CustomerID, City FROM Customers LIMIT 3;`, hint:'İki sütun, sonra LIMIT 3'},
 {q:'Çalışanlar tablosunun (<code>Employees</code>) tamamını getir.', sol:`SELECT * FROM Employees;`, hint:'Yıldız bütün sütunlar demek.'},
 {q:'Müşterilerin sadece adını (<code>CustomerName</code>) ve ülkesini (<code>Country</code>) getir.', sol:`SELECT CustomerName, Country FROM Customers;`, hint:'İki sütunu virgülle ayırarak yaz.'},
 {q:'Kategorilerin sadece adlarını getir.', sol:`SELECT CategoryName FROM Categories;`, hint:'Tablo: Categories. Sütun: CategoryName.'},
 {q:'Ürünlerin adı, paket bilgisi (<code>Unit</code>) ve fiyatı, bu sırayla.', sol:`SELECT ProductName, Unit, Price FROM Products;`, hint:'Sütunları istenen sırada yaz.'}
]},

/* ---------------------------------------------------- 2 */
{id:'hesap', no:'2', title:'Hesap yapmak ve AS', group:'Temel',
body:`
<p class="lead">SELECT'e sadece sütun adı değil, hesap da yazabilirsin. Hesap her satır için ayrı ayrı yapılır.</p>
<pre class="ex">SELECT ProductName, Price, Price * Price
FROM Products;</pre>
<p>İşaretler: <code>+</code> toplama, <code>-</code> çıkarma, <code>*</code> çarpma, <code>/</code> bölme. (SELECT'in hemen arkasındaki <code>*</code> "bütün sütunlar" demekti; iki sütunun arasındaki <code>*</code> ise çarpma.)</p>
<h3>AS: sütuna isim koy</h3>
<p>Üstteki sonuçta son sütunun adı <code>Price * Price</code> oldu, pek okunur değil. <code>AS</code> ile isim verirsin:</p>
<pre class="ex">SELECT ProductName, Price, Price * Price AS fiyat_karesi
FROM Products;</pre>
<p><code>AS</code> yazmak zorunlu değil; hesaptan sonra boşluk bırakıp ismi yazmak da aynı işi görür. Hocanın <code>SUM(p.Price) toplam_satis</code> yazması bu yüzden çalışıyor.</p>
<pre class="ex">SELECT ProductName, Price * 1.2 kdvli_fiyat
FROM Products;</pre>
<p>İsimde boşluk ve Türkçe karakter kullanma, alt çizgi kullan: <code>toplam_satis</code> iyi, <code>toplam satış</code> dert çıkarır.</p>
<h3>Bu isim ne işe yarıyor?</h3>
<p>Sonucu okunur yapıyor. Ayrıca ileride <code>ORDER BY toplam_satis</code> diye bu isimle sıralama yapacağız.</p>
<h3>Tuzak: tam sayı bölmesi</h3>
<p>Bu veride fiyatlar tam sayı. SQLite'ta <b>tam sayı / tam sayı</b> sonucu da tam sayı olur, küsurat atılır. Çalıştır, Chef Anton's Gumbo Mix'e bak (21 / 2):</p>
<pre class="ex">SELECT ProductName, Price, Price / 2, Price / 2.0, Price * 0.5
FROM Products LIMIT 5;</pre>
<p><code>21 / 2</code> = 10 çıktı, 10.5 değil. Küsuratlı sonuç istiyorsan sayıyı ondalıklı yaz: <code>Price / 2.0</code> ya da <code>Price * 0.5</code>. (AVG bu sorunu yaşamaz, ortalamayı her zaman küsuratlı verir.)</p>`,
tasks:[
 {q:'Fiyatı ve fiyatın iki katını getir, ilk 5 ürün için.', src:'Hocanın 23 Mart dersi', sol:`SELECT Price, Price * 2 FROM Products LIMIT 5;`, hint:'SELECT Price, Price * 2 ... LIMIT 5'},
 {q:'Ürünlerin adını, fiyatını ve yarı fiyatını (küsuratıyla, 21 → 10.5) getir. Son sütunun adı <code>indirimli</code> olsun.', sol:`SELECT ProductName, Price, Price / 2.0 AS indirimli FROM Products;`, hint:'Price / 2 küsuratı atar. Price / 2.0 ya da Price * 0.5 yaz.'},
 {q:'<code>OrderDetails</code> tablosundan <code>OrderID</code>, <code>Quantity</code> ve adedin 3 katını getir.', sol:`SELECT OrderID, Quantity, Quantity * 3 AS uc_kat FROM OrderDetails;`, hint:'Quantity * 3'},
 {q:'Ürünlerin adı ve fiyatın 10 fazlası.', sol:`SELECT ProductName, Price + 10 FROM Products;`, hint:'Price + 10'}
]},

/* ---------------------------------------------------- 3 */
{id:'where', no:'3', title:'WHERE ile süzmek', group:'Temel',
body:`
<p class="lead">Şimdiye kadar hep bütün satırları aldık. <code>WHERE</code> ile sadece koşula uyan satırları alırsın.</p>
<pre class="code">SELECT sütunlar
FROM tablo
WHERE koşul;</pre>
<pre class="ex">SELECT * FROM Customers
WHERE Country = 'Germany';</pre>
<h3>Karşılaştırma işaretleri</h3>
<div class="tw"><table class="ref"><tbody>
<tr><td><code>=</code></td><td>eşit</td><td><code>&lt;&gt;</code> ya da <code>!=</code></td><td>eşit değil</td></tr>
<tr><td><code>&gt;</code></td><td>büyük</td><td><code>&lt;</code></td><td>küçük</td></tr>
<tr><td><code>&gt;=</code></td><td>büyük ya da eşit</td><td><code>&lt;=</code></td><td>küçük ya da eşit</td></tr>
</tbody></table></div>
<pre class="ex">SELECT ProductName, Price FROM Products
WHERE Price > 50;</pre>
<pre class="ex">SELECT CustomerName, Country FROM Customers
WHERE Country &lt;&gt; 'USA';</pre>
<h3>Tırnak kuralı</h3>
<ul><li><b>Metin</b> değerler tek tırnak içinde: <code>'Germany'</code>, <code>'Berlin'</code>.</li>
<li><b>Sayılar</b> tırnaksız: <code>Price > 30</code>, <code>CategoryID = 1</code>.</li>
<li><b>Sütun adları</b> tırnaksız: <code>Country</code>.</li></ul>
<h3>Değerin yazımı birebir tutmalı</h3>
<p>Veritabanında ülke <code>'Germany'</code> diye kayıtlı. <code>'germany'</code>, <code>'Almanya'</code> ya da <code>'Germany '</code> (sonda boşluk) yazarsan hiç satır gelmez. Hata da vermez, sadece boş döner:</p>
<pre class="ex">SELECT * FROM Customers
WHERE Country = 'germany';</pre>
<p>Ülkelerin nasıl yazıldığını görmek için <code>SELECT DISTINCT Country FROM Customers;</code> yeter (DISTINCT 6. konuda).</p>
<h3>WHERE ve hesap birlikte</h3>
<pre class="ex">SELECT ProductName, Price, Price * Price AS fiyat_karesi
FROM Products
WHERE Price > 30;</pre>
<p>Bu tam olarak hocanın "Fiyatı 30 TL'den büyük olan ürünlerin isimleri, fiyatları ve fiyatlarının karesi" sorusunun cevabı.</p>`,
tasks:[
 {q:'Brezilya\'daki (<code>Brazil</code>) müşterilerin bütün bilgileri.', sol:`SELECT * FROM Customers WHERE Country = 'Brazil';`, hint:"WHERE Country = 'Brazil'"},
 {q:'Fiyatı 20\'den küçük ürünlerin adı ve fiyatı.', sol:`SELECT ProductName, Price FROM Products WHERE Price < 20;`, hint:'Price < 20 (sayı, tırnak yok)'},
 {q:'<code>CategoryID</code>\'si 8 olan ürünlerin adları.', sol:`SELECT ProductName FROM Products WHERE CategoryID = 8;`, hint:'WHERE CategoryID = 8'},
 {q:'London\'daki müşterilerin adı ve adresi (<code>Address</code>).', sol:`SELECT CustomerName, Address FROM Customers WHERE City = 'London';`, hint:"Şehir City sütununda: WHERE City = 'London'"},
 {q:'10250 numaralı siparişin detayları (<code>OrderDetails</code> tablosunun bütün sütunları).', sol:`SELECT * FROM OrderDetails WHERE OrderID = 10250;`, hint:'WHERE OrderID = 10250'}
]},

/* ---------------------------------------------------- 4 */
{id:'mantik', no:'4', title:'AND, OR, IN, BETWEEN', group:'Temel',
body:`
<h3>AND: ikisi de doğru olmalı</h3>
<pre class="ex">SELECT CustomerName FROM Customers
WHERE Country = 'Germany' AND City = 'Berlin';</pre>
<h3>OR: biri doğruysa yeter</h3>
<pre class="ex">SELECT CustomerName, Country FROM Customers
WHERE Country = 'Brazil' OR Country = 'USA';</pre>
<p>Dikkat: <code>WHERE Country = 'Brazil' OR 'USA'</code> diye kısaltamazsın. Her koşulda sütun adını tekrar yazman gerekir.</p>
<h3>IN: uzun OR'ların kısayolu</h3>
<p>Aynı sütun için birkaç seçenek varsa:</p>
<pre class="ex">SELECT CustomerName, Country FROM Customers
WHERE Country IN ('Brazil', 'USA');</pre>
<p>Bir üstteki sorguyla tamamen aynı sonucu verir. <code>NOT IN</code> tersini yapar:</p>
<pre class="ex">SELECT CustomerName, Country FROM Customers
WHERE Country NOT IN ('Germany', 'USA', 'France');</pre>
<h3>BETWEEN: aralık</h3>
<pre class="ex">SELECT ProductName, Price FROM Products
WHERE Price BETWEEN 40 AND 90;</pre>
<p><code>BETWEEN 40 AND 90</code> uçları da dahil eder, yani <code>Price >= 40 AND Price &lt;= 90</code> ile aynı. Buradaki AND, BETWEEN'in bir parçası.</p>
<h3>Tuzak: AND, OR'dan önce çalışır</h3>
<p>Matematikte çarpma toplamadan önce yapılır; SQL'de de <code>AND</code> önce çalışır. "Kategorisi 1 ya da 2 olan ve fiyatı 30'dan büyük ürünler" istiyoruz:</p>
<pre class="ex">SELECT ProductName, CategoryID, Price FROM Products
WHERE CategoryID = 1 OR CategoryID = 2 AND Price > 30;</pre>
<p>Sonuçta 30'dan ucuz içecekler de var. SQL bunu "kategorisi 1 olanlar, <b>ya da</b> kategorisi 2 olup 30'dan pahalı olanlar" diye okudu. Parantezle düzelt:</p>
<pre class="ex">SELECT ProductName, CategoryID, Price FROM Products
WHERE (CategoryID = 1 OR CategoryID = 2) AND Price > 30;</pre>
<p class="tip">AND ile OR'u aynı yerde kullanıyorsan parantez koy, kafan rahat olsun.</p>`,
tasks:[
 {q:'Germany\'de ve Berlin şehrinde yaşayan müşterilerin isimleri.', src:'Hocanın sorusu', sol:`SELECT CustomerName FROM Customers WHERE Country = 'Germany' AND City = 'Berlin';`, hint:'İki koşul, ikisi de doğru olmalı: AND'},
 {q:'Brezilya ve USA\'daki müşterilerin bütün bilgileri, <code>IN</code> kullanarak.', src:'Hocanın sorusu', sol:`SELECT * FROM Customers WHERE Country IN ('Brazil', 'USA');`, hint:"Country IN ('Brazil', 'USA')"},
 {q:'Fiyatı 40 ile 90 arasında olan ürünlerin isimleri ve fiyatları.', src:'Hocanın sorusu', sol:`SELECT ProductName, Price FROM Products WHERE Price BETWEEN 40 AND 90;`, hint:'BETWEEN 40 AND 90'},
 {q:'Kategorisi 3 ya da 4 olup fiyatı 30\'dan büyük ürünlerin adları ve fiyatları.', sol:`SELECT ProductName, Price FROM Products WHERE (CategoryID = 3 OR CategoryID = 4) AND Price > 30;`, hint:'Parantez! (CategoryID = 3 OR CategoryID = 4) AND ... ya da CategoryID IN (3, 4) AND ...'},
 {q:'Almanya, Fransa ve İspanya (<code>Spain</code>) dışındaki müşterilerin adları ve ülkeleri.', sol:`SELECT CustomerName, Country FROM Customers WHERE Country NOT IN ('Germany', 'France', 'Spain');`, hint:'NOT IN (...)'},
 {q:'Fiyatı 10\'dan küçük <b>ya da</b> 100\'den büyük ürünlerin adı ve fiyatı.', sol:`SELECT ProductName, Price FROM Products WHERE Price < 10 OR Price > 100;`, hint:'Price < 10 OR Price > 100'},
 {mcq:true, q:'<code>WHERE Country = \'Brazil\' OR \'USA\'</code> neden yanlış?', options:['OR yerine AND yazılmalı','OR\'un iki tarafı da tam koşul olmalı: Country = \'USA\' yazılmalı','USA çift tırnakla yazılmalı','Hiçbir sorun yok'], answer:1, explain:'Her koşul "sütun işaret değer" şeklinde tam yazılır: <code>Country = \'Brazil\' OR Country = \'USA\'</code>. Kısa yolu IN: <code>Country IN (\'Brazil\', \'USA\')</code>.'}
]},

/* ---------------------------------------------------- 5 */
{id:'like', no:'5', title:'LIKE ile metin arama', group:'Temel',
body:`
<p class="lead"><code>=</code> tam eşleşme ister. "İçinde 'ha' geçen", "C ile başlayan" gibi aramalar için <code>LIKE</code> kullanılır.</p>
<p>LIKE'ta iki özel işaret var:</p>
<ul><li><code>%</code> : <b>herhangi sayıda</b> karakter (hiç karakter de olur)</li>
<li><code>_</code> : <b>tam bir</b> karakter</li></ul>
<div class="tw"><table class="ref"><thead><tr><th>Kalıp</th><th>Anlamı</th><th>Eşleşir</th></tr></thead><tbody>
<tr><td><code>'C%'</code></td><td>C ile başlayan</td><td>Chais, Chang, Côte de Blaye</td></tr>
<tr><td><code>'%e'</code></td><td>e ile biten</td><td>Chartreuse verte, Côte de Blaye</td></tr>
<tr><td><code>'%ha%'</code></td><td>içinde ha geçen</td><td>Chais, Chang, Chartreuse</td></tr>
<tr><td><code>'_a%'</code></td><td>2. harfi a olan</td><td>Camembert, Laughing...</td></tr>
<tr><td><code>'%1997'</code></td><td>1997 ile biten</td><td>15.01.1997</td></tr>
</tbody></table></div>
<pre class="ex">SELECT * FROM Products
WHERE ProductName LIKE '%ha%';</pre>
<p>Bu, hocanın derste gösterdiği örnek. "ha" ürün adının herhangi bir yerinde geçiyor.</p>
<p>Bu veritabanında LIKE büyük/küçük harfe bakmaz: <code>'c%'</code> ile <code>'C%'</code> aynı sonucu verir. (= ile karşılaştırmada harf önemliydi.)</p>
<pre class="ex">SELECT ProductName FROM Products
WHERE ProductName LIKE 'C%';</pre>
<h3>LIKE ile tarih arama</h3>
<p>Önce tarihin nasıl yazıldığına bak. Her tarih sorusundan önce bunu yap:</p>
<pre class="ex">SELECT OrderID, OrderDate FROM Orders LIMIT 5;</pre>
<p>Bu veride <code>OrderDate</code>, <code>'4.07.1996'</code> gibi yazılmış bir metin: <b>gün.ay.yıl</b>, günün başında sıfır yok. Yıl sonda olduğu için yıl aramak <code>'%1997'</code> ya da hocanın yazdığı gibi <code>'%1997%'</code>:</p>
<pre class="ex">SELECT * FROM Orders
WHERE OrderDate LIKE '%1997%';</pre>
<h3>Ay ararken dikkat</h3>
<p>Temmuz (07) siparişleri için hocanın kalıbı <code>'%07%'</code>. Bu veride doğru çalışır, çünkü günler sıfırsız yazılmış (<code>7.08.1996</code>, <code>07.08.1996</code> değil) ve yıllarda "07" geçmiyor. Ama aynı yöntem Aralık (12) için bozulur. Çalıştır ve sonuca bak:</p>
<pre class="ex">SELECT OrderID, OrderDate FROM Orders
WHERE OrderDate LIKE '%12%';</pre>
<p>Aralık olmayan tarihler de geldi: <code>12.07.1996</code> Temmuz'un 12'si, ama içinde "12" geçiyor. Doğrusu ayı <b>noktaların arasında</b> aramak:</p>
<pre class="ex">SELECT OrderID, OrderDate FROM Orders
WHERE OrderDate LIKE '%.12.%';</pre>
<p>Noktalar sayesinde sadece ay kısmı eşleşir. Ay ve yıl birlikte: <code>LIKE '%.12.1996'</code>.</p>
<p class="tip">Kural: ay ararken her zaman <code>'%.AA.%'</code> yaz. Hocanın <code>'%07%'</code>'si bu veride tesadüfen doğru; <code>'%.07.%'</code> her zaman doğru.</p>
<p class="aside">Başka bir veritabanında tarih <code>'1996-07-04'</code> (yıl-ay-gün) biçiminde olabilir. Orada yıl başta (<code>'1996%'</code>), ay tirelerin arasında (<code>'%-07-%'</code>). Biçim değişince kalıp da değişir; o yüzden önce <code>SELECT OrderDate ... LIMIT 5</code> ile bak.</p>
<p>Bir de şu: tarih metin olduğu için <code>ORDER BY OrderDate</code> alfabetik sıralar ve <code>10.07.1996</code>'yı <code>4.07.1996</code>'dan önce koyar. Tarih sırası için <code>OrderID</code>'ye göre sıralamak bu veride daha güvenli (siparişler zaman sırasıyla numaralanmış).</p>`,
tasks:[
 {q:'Adında \'ha\' geçen ürünlerin bütün bilgileri.', src:'Hocanın örneği', sol:`SELECT * FROM Products WHERE ProductName LIKE '%ha%';`, hint:"LIKE '%ha%'"},
 {q:'Adresinin herhangi bir yerinde "da" geçen müşterilerin adresleri (sadece <code>Address</code>).', src:'Hocanın sorusu', sol:`SELECT Address FROM Customers WHERE Address LIKE '%da%';`, hint:"Address LIKE '%da%'"},
 {q:'Kanada\'da (<code>Canada</code>) yaşayıp isminde \'in\' geçen müşterilerin isimleri.', src:'Hocanın sorusu', sol:`SELECT CustomerName FROM Customers WHERE CustomerName LIKE '%in%' AND Country = 'Canada';`, hint:"LIKE ile = koşulunu AND ile bağla."},
 {q:'\'S\' harfiyle başlayan ürünlerin adları.', sol:`SELECT ProductName FROM Products WHERE ProductName LIKE 'S%';`, hint:"'S%' (başta S, sonrası ne olursa)"},
 {q:'Adı \'a\' harfiyle biten müşterilerin adları.', sol:`SELECT CustomerName FROM Customers WHERE CustomerName LIKE '%a';`, hint:"'%a'"},
 {q:'1997 yılının Ocak ayında verilen siparişlerin bütün bilgileri.', sol:`SELECT * FROM Orders WHERE OrderDate LIKE '%.01.1997';`, hint:"Tarih '15.01.1997' biçiminde: '%.01.1997'"},
 {q:'1996 yılının Kasım (11) ayında verilen siparişlerin numarası ve tarihi. Dikkat: 11.07.1996 gibi günler gelmemeli.', sol:`SELECT OrderID, OrderDate FROM Orders WHERE OrderDate LIKE '%.11.1996';`, hint:"'%11%' yetmez (gün 11 olanlar da gelir). Ayı noktalarla ara."},
 {mcq:true, q:"Bu veride (4.07.1996 biçimi) Ekim (10) siparişleri için hangi kalıp doğru?", options:["LIKE '%10%'","LIKE '%.10.%'","LIKE '10%'","LIKE '%-10-%'"], answer:1, explain:"<code>'%10%'</code> ve <code>'10%'</code> ayın 10'unu da yakalar (10.07.1996). <code>'%-10-%'</code> yıl-ay-gün biçimindeki veritabanları için; burada tire yok."}
]},

/* ---------------------------------------------------- 6 */
{id:'siralama', no:'6', title:'ORDER BY, LIMIT, DISTINCT', group:'Temel',
body:`
<h3>ORDER BY: sırala</h3>
<pre class="ex">SELECT ProductName, Price FROM Products
ORDER BY Price;</pre>
<p>Varsayılan küçükten büyüğe (<code>ASC</code>, ascending: artan). Büyükten küçüğe için <code>DESC</code> (descending: azalan). Hoca "DESC'i unutma" dedi: "en çok", "en pahalı", "büyükten küçüğe (b&gt;k)" gören her soruda DESC gerekir.</p>
<pre class="ex">SELECT ProductName, Price FROM Products
ORDER BY Price DESC;</pre>
<p>Metinler alfabetik sıralanır. Birden fazla sütun yazarsan önce birincisine göre, eşit olanlarda ikincisine göre sıralar:</p>
<pre class="ex">SELECT CustomerName, Country, City FROM Customers
ORDER BY Country, City;</pre>
<p>Her sütunun yönü ayrı yazılır: <code>ORDER BY Country ASC, City DESC</code>.</p>
<h3>LIMIT: ilk N satır</h3>
<pre class="ex">SELECT ProductName, Price FROM Products
ORDER BY Price DESC
LIMIT 3;</pre>
<p>"En pahalı 3 ürün" = pahalıdan ucuza sırala, ilk 3'ü al.</p>
<h3>DISTINCT: tekrarları at</h3>
<pre class="ex">SELECT Country FROM Customers;</pre>
<p>Aynı ülke tekrar tekrar geliyor. Her birini bir kez görmek için:</p>
<pre class="ex">SELECT DISTINCT Country FROM Customers;</pre>
<p>DISTINCT, SELECT'in hemen arkasına yazılır ve seçtiğin <b>bütün sütunlara birlikte</b> bakar: <code>SELECT DISTINCT Country, City</code> her ülke-şehir ikilisini bir kez getirir.</p>
<h3>Sıra önemli</h3>
<pre class="code">SELECT ... FROM ... WHERE ... ORDER BY ... LIMIT ...;</pre>
<p>WHERE her zaman ORDER BY'dan önce gelir, LIMIT en sonda.</p>`,
tasks:[
 {q:'Ürünlerin adı ve fiyatı, pahalıdan ucuza.', sol:`SELECT ProductName, Price FROM Products ORDER BY Price DESC;`, ordered:[1], hint:'ORDER BY Price DESC'},
 {q:'En ucuz 5 ürünün adı ve fiyatı.', sol:`SELECT ProductName, Price FROM Products ORDER BY Price LIMIT 5;`, ordered:[1], hint:'Ucuzdan pahalıya sırala (ASC), sonra LIMIT 5.'},
 {q:'Müşterilerin bulunduğu ülkeler, her ülke bir kez.', sol:`SELECT DISTINCT Country FROM Customers;`, hint:'SELECT DISTINCT ...'},
 {q:'Almanya\'daki müşterilerin adları, alfabetik sırayla (A\'dan Z\'ye).', sol:`SELECT CustomerName FROM Customers WHERE Country = 'Germany' ORDER BY CustomerName;`, ordered:[0], hint:'Önce WHERE, sonra ORDER BY CustomerName'},
 {q:'Sipariş almış farklı çalışan numaraları (<code>EmployeeID</code>), küçükten büyüğe.', sol:`SELECT DISTINCT EmployeeID FROM Orders ORDER BY EmployeeID;`, ordered:[0], hint:'Orders tablosunda DISTINCT EmployeeID, sonra ORDER BY'}
]},

/* ---------------------------------------------------- 7 */
{id:'fonksiyon', no:'7', title:'COUNT, SUM, AVG, MIN, MAX', group:'Hesaplama',
body:`
<p class="lead">Bazen satırların kendisini değil, onlardan çıkan <b>tek bir sonucu</b> istersin: kaç tane, toplam, ortalama...</p>
<div class="tw"><table class="ref"><tbody>
<tr><td><code>COUNT(...)</code></td><td>kaç tane</td><td>"kaç müşteri", "sayısı"</td></tr>
<tr><td><code>SUM(...)</code></td><td>toplam</td><td>"toplam kazanç", "toplam satış"</td></tr>
<tr><td><code>AVG(...)</code></td><td>ortalama</td><td>"fiyat ortalaması", "ort fiyat"</td></tr>
<tr><td><code>MIN(...)</code></td><td>en küçük</td><td>"en ucuz"</td></tr>
<tr><td><code>MAX(...)</code></td><td>en büyük</td><td>"en pahalı", "maks"</td></tr>
</tbody></table></div>
<pre class="ex">SELECT COUNT(*) FROM Products;</pre>
<pre class="ex">SELECT AVG(Price), MIN(Price), MAX(Price), SUM(Price)
FROM Products;</pre>
<p>Sonuç tek satır: bütün ürünler tek bir cevaba indi.</p>
<h3>WHERE ile birlikte</h3>
<p>Önce WHERE satırları süzer, fonksiyon kalan satırlarda hesaplanır:</p>
<pre class="ex">SELECT AVG(Price) FROM Products
WHERE CategoryID = 1;</pre>
<h3>COUNT'un üç hâli (sınavda çıkıyor)</h3>
<ul>
<li><code>COUNT(*)</code>: satır sayısı.</li>
<li><code>COUNT(sütun)</code>: o sütunu boş (NULL) olmayan satırların sayısı. Çoğu zaman <code>COUNT(*)</code> ile aynı çıkar.</li>
<li><code>COUNT(DISTINCT sütun)</code>: o sütundaki <b>farklı</b> değerlerin sayısı.</li>
</ul>
<p>Hocanın iki sorusu tam bu fark üzerine: "orders tablosunda kaç müşteri var" ve "eşsiz müşteri nasıl bulunur".</p>
<pre class="ex">SELECT COUNT(CustomerID) FROM Orders;</pre>
<p>Bu aslında <b>sipariş</b> sayısını verir. Aynı müşteri 5 sipariş verdiyse 5 kere sayılır.</p>
<pre class="ex">SELECT COUNT(DISTINCT CustomerID) FROM Orders;</pre>
<p>Bu ise sipariş vermiş <b>farklı müşteri</b> sayısı. "Eşsiz", "farklı", "tekrarsız" kelimelerini görünce DISTINCT aklına gelsin.</p>
<h3>Küsuratı yuvarlamak</h3>
<pre class="ex">SELECT ROUND(AVG(Price), 2) AS ortalama FROM Products;</pre>
<h3>Yaygın hata</h3>
<p><code>SELECT ProductName, MAX(Price) FROM Products;</code> bu veritabanında (SQLite) çalışır, ama çoğu veritabanı hata verir. Fonksiyonla birlikte normal bir sütun istiyorsan çoğu zaman GROUP BY gerekir, sıradaki konu bu. "En pahalı ürünün adı" için güvenli yol: <code>ORDER BY Price DESC LIMIT 1</code>.</p>`,
tasks:[
 {q:'<code>Products</code> tablosunda kaç ürün var?', sol:`SELECT COUNT(*) FROM Products;`, hint:'COUNT(*)'},
 {q:'<code>Orders</code> tablosunda kaç <b>farklı</b> müşteri var?', src:'Hocanın sorusu', sol:`SELECT COUNT(DISTINCT CustomerID) FROM Orders;`, hint:'COUNT(DISTINCT CustomerID)'},
 {q:'Ürünlerin ortalama fiyatı.', sol:`SELECT AVG(Price) FROM Products;`, hint:'AVG(Price)'},
 {q:'En ucuz ve en pahalı ürünün fiyatı, tek sorguda (iki sütun).', sol:`SELECT MIN(Price), MAX(Price) FROM Products;`, hint:'SELECT MIN(...), MAX(...)'},
 {q:'10248 numaralı siparişteki toplam ürün adedi (<code>Quantity</code> toplamı).', sol:`SELECT SUM(Quantity) FROM OrderDetails WHERE OrderID = 10248;`, hint:'OrderDetails tablosunda SUM(Quantity), WHERE OrderID = 10248'},
 {q:'Almanya\'daki müşteri sayısı.', sol:`SELECT COUNT(*) FROM Customers WHERE Country = 'Germany';`, hint:'COUNT + WHERE'},
 {q:'1997 yılında kaç sipariş verilmiş?', sol:`SELECT COUNT(*) FROM Orders WHERE OrderDate LIKE '%1997%';`, hint:"COUNT(*) + WHERE OrderDate LIKE '%1997%'"},
 {mcq:true, q:'Bir müşteri 3, diğeri 2 sipariş vermiş (Orders\'ta 5 satır). <code>COUNT(DISTINCT CustomerID)</code> kaç döner?', options:['5','2','3','1'], answer:1, explain:'İki farklı müşteri var. <code>COUNT(CustomerID)</code> 5 dönerdi.'}
]},

/* ---------------------------------------------------- 8 */
{id:'grup', no:'8', title:'GROUP BY ve HAVING', group:'Hesaplama',
body:`
<p class="lead">"Her ülkeden kaç müşteri var?" COUNT tek bir sayı verir, ama biz her ülke için ayrı bir sayı istiyoruz. Bunun için <code>GROUP BY</code> var.</p>
<pre class="ex">SELECT Country, COUNT(CustomerID)
FROM Customers
GROUP BY Country;</pre>
<h3>Kafanda nasıl canlandırmalı?</h3>
<p>GROUP BY satırları kutulara ayırır: aynı ülkedeki müşteriler aynı kutuya. Sonra COUNT, SUM, AVG <b>her kutu için ayrı</b> hesaplanır ve her kutu sonuçta tek satır olur.</p>
<div class="gviz" id="gviz"></div>
<p>Soruda <b>"her ... için"</b>, <b>"... başına"</b>, <b>"...'e göre"</b>, <b>"... kırılımında"</b> görürsen GROUP BY lazım.</p>
<h3>Altın kural</h3>
<p>SELECT'te fonksiyonun içinde olmayan her sütun GROUP BY'da da olmalı. Yukarıda <code>Country</code> SELECT'te var, o yüzden GROUP BY'da da var.</p>
<h3>Birden çok sütuna göre gruplamak</h3>
<p>"Önce ülkeye sonra şehre göre" demek, kutuların ülke+şehir ikilisine göre ayrılması demek:</p>
<pre class="ex">SELECT Country, City, COUNT(CustomerID)
FROM Customers
GROUP BY Country, City;</pre>
<h3>Sıralamayla birlikte</h3>
<pre class="ex">SELECT Country, COUNT(*) AS musteri_sayisi
FROM Customers
GROUP BY Country
ORDER BY musteri_sayisi DESC;</pre>
<h3>HAVING: grupları süzmek</h3>
<p>WHERE gruplamadan <b>önce</b> satırları süzer. Grupladıktan <b>sonra</b> "3'ten fazla müşterisi olan ülkeler" gibi bir süzgeç için <code>HAVING</code> kullanılır:</p>
<pre class="ex">SELECT Country, COUNT(*) AS musteri_sayisi
FROM Customers
GROUP BY Country
HAVING COUNT(*) > 3;</pre>
<p>Kural: koşulda COUNT/SUM/AVG gibi bir fonksiyon varsa HAVING, yoksa WHERE.</p>
<pre class="ex">SELECT CategoryID, AVG(Price)
FROM Products
WHERE Price > 20
GROUP BY CategoryID;</pre>
<p>Bu sorgu önce 20'den pahalı ürünleri alıyor (WHERE), sonra onları kategorilere ayırıyor, her kategorinin ortalamasını hesaplıyor.</p>`,
tasks:[
 {q:'Her ülkeden kaç müşteri var? (ülke ve sayı)', src:'Hocanın sorusu', sol:`SELECT Country, COUNT(CustomerID) FROM Customers GROUP BY Country;`, hint:'GROUP BY Country'},
 {q:'Önce ülkeye sonra şehre göre gruplayıp müşteri sayısını bul.', src:'Hocanın sorusu', sol:`SELECT Country, City, COUNT(CustomerID) FROM Customers GROUP BY Country, City;`, hint:'GROUP BY Country, City'},
 {q:'Her kategori (<code>CategoryID</code>) için ürün sayısı ve ortalama fiyat.', sol:`SELECT CategoryID, COUNT(*), AVG(Price) FROM Products GROUP BY CategoryID;`, hint:'SELECT CategoryID, COUNT(*), AVG(Price) ... GROUP BY CategoryID'},
 {q:'Her çalışanın (<code>EmployeeID</code>) aldığı sipariş sayısı, çoktan aza.', sol:`SELECT EmployeeID, COUNT(*) AS n FROM Orders GROUP BY EmployeeID ORDER BY n DESC;`, ordered:[1], hint:'Orders tablosu, GROUP BY EmployeeID, ORDER BY ... DESC'},
 {q:'4\'ten fazla müşterisi olan ülkeler ve müşteri sayıları.', sol:`SELECT Country, COUNT(*) FROM Customers GROUP BY Country HAVING COUNT(*) > 4;`, hint:'Koşulda COUNT var, yani HAVING.'},
 {q:'Toplam adedi 100\'den fazla olan siparişlerin numarası (<code>OrderID</code>) ve toplam adedi.', sol:`SELECT OrderID, SUM(Quantity) FROM OrderDetails GROUP BY OrderID HAVING SUM(Quantity) > 100;`, hint:'OrderDetails, GROUP BY OrderID, HAVING SUM(Quantity) > 100'},
 {mcq:true, q:'"Ortalama fiyatı 30\'dan büyük kategoriler" için koşul nereye yazılır?', options:['WHERE AVG(Price) > 30','HAVING AVG(Price) > 30','GROUP BY AVG(Price) > 30','ORDER BY AVG(Price) > 30'], answer:1, explain:'Koşul bir fonksiyonun (AVG) sonucuna bakıyor, bu sonuç ancak gruplamadan sonra belli olur. O yüzden HAVING.'}
]},

/* ---------------------------------------------------- 9 */
{id:'join', no:'9', title:'JOIN: iki tabloyu bağlamak', group:'Birleştirme',
body:`
<p class="lead">Şunu çalıştır:</p>
<pre class="ex">SELECT ProductName, CategoryID FROM Products;</pre>
<p>Ürünün kategorisi 1, 2, 8 gibi sayılarla duruyor. Kategorinin <b>adı</b> burada yok, <code>Categories</code> tablosunda:</p>
<pre class="ex">SELECT * FROM Categories;</pre>
<p>İki tabloda da <code>CategoryID</code> var. Bu ortak sütunla iki tabloyu yan yana yapıştırabiliriz: Products'taki her satırın yanına, CategoryID'si aynı olan Categories satırı gelir. Bunun adı <b>JOIN</b>.</p>
<pre class="ex">SELECT ProductName, CategoryName
FROM Products
LEFT JOIN Categories ON Products.CategoryID = Categories.CategoryID;</pre>
<p>Kalıp:</p>
<pre class="code">SELECT ...
FROM tablo1
LEFT JOIN tablo2 ON tablo1.ortak_sutun = tablo2.ortak_sutun;</pre>
<ul><li><code>ON</code>'dan sonra hangi sütunların eşleşeceğini yazarsın.</li>
<li><code>Products.CategoryID</code> "Products tablosunun CategoryID sütunu" demek. Nokta "şu tablonun şu sütunu" anlamında.</li></ul>
<h3>Neden Tablo.Sütun yazıyoruz?</h3>
<p>İki tabloda da <code>CategoryID</code> var. Sadece <code>CategoryID</code> yazarsan veritabanı hangisini kastettiğini bilemez. Çalıştır, hataya bak:</p>
<pre class="ex">SELECT ProductName, CategoryID, CategoryName
FROM Products
LEFT JOIN Categories ON Products.CategoryID = Categories.CategoryID;</pre>
<p>"ambiguous" belirsiz demek. Düzeltmek için <code>Products.CategoryID</code> yaz. Sadece tek tabloda olan sütunlarda (ProductName gibi) gerek yok, yazsan da zararı yok.</p>
<h3>Takma adlar: p, od, o, cu...</h3>
<p>Tablo adını her seferinde yazmak uzun. FROM ya da JOIN'de tablonun arkasına kısa bir isim yazarsın, sonra hep onu kullanırsın:</p>
<pre class="ex">SELECT p.ProductName, ca.CategoryName
FROM Products p
LEFT JOIN Categories ca ON p.CategoryID = ca.CategoryID;</pre>
<p>Hocanın kodlarındaki <code>o</code> (Orders), <code>od</code> (OrderDetails), <code>p</code> (Products), <code>ca</code> (Categories), <code>cu</code> (Customers), <code>em</code> (Employees) bunlar. Takma ad verdiysen o tablo için artık hep takma adı kullan.</p>
<p>Takma ad <b>boşlukla</b> yazılır: <code>FROM Orders o</code>. <code>FROM Orders.o</code> yazarsan hata alırsın (hocanın bir çözümünde bu yazım hatası var).</p>
<h3>LEFT JOIN ile INNER JOIN farkı</h3>
<p><code>LEFT JOIN</code>: soldaki (FROM'daki) tablonun <b>bütün</b> satırları kalır. Sağda eşi yoksa o sütunlar boş (NULL) gelir.<br>
<code>INNER JOIN</code> (ya da sadece <code>JOIN</code>): sadece iki tarafta da eşi olan satırlar kalır.</p>
<p>Bazı müşteriler hiç sipariş vermemiş. İkisini de çalıştır, satır sayılarını ve ilk satırları karşılaştır:</p>
<pre class="ex">SELECT cu.CustomerName, o.OrderID
FROM Customers cu
LEFT JOIN Orders o ON cu.CustomerID = o.CustomerID
ORDER BY o.OrderID;</pre>
<pre class="ex">SELECT cu.CustomerName, o.OrderID
FROM Customers cu
INNER JOIN Orders o ON cu.CustomerID = o.CustomerID
ORDER BY o.OrderID;</pre>
<p>LEFT JOIN'de sipariş vermemiş müşteriler OrderID'si NULL olarak geldi (en üstte), INNER JOIN'de hiç yoklar. Hoca hep LEFT JOIN kullanıyor ve sorularının çoğunda ikisi aynı sonucu verir. Sen de LEFT JOIN yazabilirsin.</p>
<h3>Boş değeri yakalamak: IS NULL</h3>
<p>Boş değer <code>= NULL</code> ile değil <code>IS NULL</code> ile aranır. "Hiç sipariş vermemiş müşteriler":</p>
<pre class="ex">SELECT cu.CustomerName
FROM Customers cu
LEFT JOIN Orders o ON cu.CustomerID = o.CustomerID
WHERE o.OrderID IS NULL;</pre>`,
tasks:[
 {q:'Her ürünün adı ve kategori adı.', src:'Hocanın sorusu', sol:`SELECT p.ProductName, ca.CategoryName FROM Products p LEFT JOIN Categories ca ON p.CategoryID = ca.CategoryID;`, hint:'Products LEFT JOIN Categories ON ... CategoryID = ... CategoryID'},
 {q:'Her ürünün adı ve tedarikçisinin adı (<code>SupplierName</code>).', sol:`SELECT p.ProductName, s.SupplierName FROM Products p LEFT JOIN Suppliers s ON p.SupplierID = s.SupplierID;`, hint:'Ortak sütun SupplierID.'},
 {q:'Her siparişin numarası (<code>OrderID</code>) ve siparişi veren müşterinin adı.', sol:`SELECT o.OrderID, cu.CustomerName FROM Orders o LEFT JOIN Customers cu ON o.CustomerID = cu.CustomerID;`, hint:'Orders LEFT JOIN Customers, ortak sütun CustomerID.'},
 {q:'Her siparişin numarası ve siparişi alan çalışanın adı (<code>FirstName</code>).', sol:`SELECT o.OrderID, em.FirstName FROM Orders o LEFT JOIN Employees em ON o.EmployeeID = em.EmployeeID;`, hint:'Orders LEFT JOIN Employees, ortak sütun EmployeeID.'},
 {q:'Beverages kategorisindeki ürünlerin adları ve fiyatları.', sol:`SELECT p.ProductName, p.Price FROM Products p LEFT JOIN Categories ca ON p.CategoryID = ca.CategoryID WHERE ca.CategoryName = 'Beverages';`, hint:"JOIN'den sonra WHERE ca.CategoryName = 'Beverages'"},
 {q:'Hiç sipariş vermemiş müşterilerin adları ve ülkeleri.', sol:`SELECT cu.CustomerName, cu.Country FROM Customers cu LEFT JOIN Orders o ON cu.CustomerID = o.CustomerID WHERE o.OrderID IS NULL;`, hint:'Customers LEFT JOIN Orders, sonra WHERE o.OrderID IS NULL'},
 {mcq:true, q:'<code>ambiguous column name: CategoryID</code> hatası ne demek?', options:['CategoryID diye bir sütun yok','CategoryID iki tabloda da var, hangisi olduğunu belirtmelisin','CategoryID sayı değil','JOIN yazmayı unuttun'], answer:1, explain:'Başına tablo adı ya da takma ad koyarak düzeltirsin: <code>p.CategoryID</code>.'}
]},

/* ---------------------------------------------------- 10 */
{id:'coklu-join', no:'10', title:'Zincirleme JOIN', group:'Birleştirme',
body:`
<p class="lead">Hocanın sorularının çoğu bu konudan. Mesela "USA'da yaşayan müşterilerin kazandırdığı toplam kazanç". Burada lazım olanlar:</p>
<ul><li>müşterinin ülkesi → <code>Customers.Country</code></li><li>ürünün fiyatı → <code>Products.Price</code></li></ul>
<p>Ama Customers ile Products arasında doğrudan bir bağ yok. Haritaya bak:</p>
${MAP_HTML}
<p>Customers'tan Products'a giden yol: <b>Customers → Orders → OrderDetails → Products</b>. Yoldaki her adım bir LEFT JOIN.</p>
<h3>OrderDetails neden var?</h3>
<p>Bir siparişte birden fazla ürün olabilir, bir ürün de birçok siparişte geçebilir. Bu yüzden arada bir köprü tablo var: <code>OrderDetails</code>'in her satırı "şu siparişte şu üründen şu kadar adet" der. Orders ile Products arasında her zaman OrderDetails'ten geçersin.</p>
<h3>Tarif (her soruda aynı)</h3>
<ol>
<li><b>Hangi bilgiler lazım?</b> Her biri hangi tabloda? (ülke → Customers, fiyat → Products, kategori adı → Categories, çalışan adı → Employees, tarih → Orders, adet → OrderDetails)</li>
<li><b>Yolu bul.</b> Haritada bu tabloları birleştiren yolu takip et.</li>
<li><b>FROM ile başla, yoldaki her tablo için bir LEFT JOIN yaz.</b> Hoca genelde <code>FROM Orders o</code> ile başlıyor, çünkü Orders haritanın ortasında, herkese komşu.</li>
<li><b>En son WHERE / GROUP BY / ORDER BY ekle.</b></li>
</ol>
<h3>Adım adım kuralım</h3>
<p>Önce siparişler ve detayları:</p>
<pre class="ex">SELECT o.OrderID, o.OrderDate, od.ProductID, od.Quantity
FROM Orders o
LEFT JOIN OrderDetails od ON o.OrderID = od.OrderID;</pre>
<p>Ürün adı ve fiyatı için Products'ı ekle:</p>
<pre class="ex">SELECT o.OrderID, p.ProductName, p.Price, od.Quantity
FROM Orders o
LEFT JOIN OrderDetails od ON o.OrderID = od.OrderID
LEFT JOIN Products p ON od.ProductID = p.ProductID;</pre>
<p>Müşterinin ülkesi için Customers'ı ekle (Customers, Orders'a bağlı):</p>
<pre class="ex">SELECT o.OrderID, cu.CustomerName, cu.Country, p.ProductName, p.Price
FROM Orders o
LEFT JOIN OrderDetails od ON o.OrderID = od.OrderID
LEFT JOIN Products p ON od.ProductID = p.ProductID
LEFT JOIN Customers cu ON o.CustomerID = cu.CustomerID;</pre>
<p>Elimizde tek bir büyük tablo var: her satır "bir siparişteki bir ürün", yanında müşteri bilgisi. Geriye süzmek ve toplamak kaldı:</p>
<pre class="ex">SELECT SUM(p.Price)
FROM Orders o
LEFT JOIN OrderDetails od ON o.OrderID = od.OrderID
LEFT JOIN Products p ON od.ProductID = p.ProductID
LEFT JOIN Customers cu ON o.CustomerID = cu.CustomerID
WHERE cu.Country = 'USA';</pre>
<p>Bu hocanın çözümü. JOIN'lerin sırası çok önemli değil; önemli olan, ON kısmında kullandığın tablonun <b>daha önce eklenmiş</b> olması. (Mesela <code>od.ProductID</code> kullanmadan önce OrderDetails'i eklemiş olmalısın.)</p>
<h3>Price mı, Price * Quantity mi?</h3>
<p><code>Price</code> ürünün <b>tek adet</b> fiyatı, <code>Quantity</code> o siparişte kaç adet alındığı. Gerçek kazanç <code>SUM(p.Price * od.Quantity)</code> olur. Hoca derste <code>SUM(p.Price)</code> yazdı. Sınavda soru nasıl soruluyorsa öyle yaz: "adet", "miktar" geçiyorsa Quantity'yi kullan.</p>`,
tasks:[
 {q:'Her sipariş satırı için <code>OrderID</code>, ürün adı ve adet.', sol:`SELECT od.OrderID, p.ProductName, od.Quantity FROM OrderDetails od LEFT JOIN Products p ON od.ProductID = p.ProductID;`, hint:'Orders\'a gerek yok: OrderDetails\'te OrderID zaten var. OrderDetails LEFT JOIN Products.'},
 {q:'10250 numaralı siparişteki ürünlerin adları ve kategori adları.', sol:`SELECT p.ProductName, ca.CategoryName FROM OrderDetails od LEFT JOIN Products p ON od.ProductID = p.ProductID LEFT JOIN Categories ca ON p.CategoryID = ca.CategoryID WHERE od.OrderID = 10250;`, hint:'Yol: OrderDetails → Products → Categories. WHERE od.OrderID = 10250'},
 {q:'Almanya\'daki müşterilerin siparişlerinde geçen ürünler: müşteri adı ve ürün adı.', sol:`SELECT cu.CustomerName, p.ProductName FROM Orders o LEFT JOIN Customers cu ON o.CustomerID = cu.CustomerID LEFT JOIN OrderDetails od ON o.OrderID = od.OrderID LEFT JOIN Products p ON od.ProductID = p.ProductID WHERE cu.Country = 'Germany';`, hint:'Yol: Customers ← Orders → OrderDetails → Products'},
 {q:'Speedy Express ile gönderilen siparişlerin numarası ve müşteri adı.', sol:`SELECT o.OrderID, cu.CustomerName FROM Orders o LEFT JOIN Shippers sh ON o.ShipperID = sh.ShipperID LEFT JOIN Customers cu ON o.CustomerID = cu.CustomerID WHERE sh.ShipperName = 'Speedy Express';`, hint:'Orders\'a hem Shippers hem Customers bağlanır.'},
 {q:'Nancy adlı çalışanın aldığı siparişlerdeki ürünler: <code>OrderID</code> ve ürün adı.', sol:`SELECT o.OrderID, p.ProductName FROM Orders o LEFT JOIN Employees em ON o.EmployeeID = em.EmployeeID LEFT JOIN OrderDetails od ON o.OrderID = od.OrderID LEFT JOIN Products p ON od.ProductID = p.ProductID WHERE em.FirstName = 'Nancy';`, hint:'Yol: Employees ← Orders → OrderDetails → Products'},
 {mcq:true, q:'Müşterinin ülkesine göre kategori bazında ortalama fiyat isteniyor. Hangi tablolar gerekir?', options:['Customers, Products, Categories','Customers, Orders, Products, Categories','Customers, Orders, OrderDetails, Products, Categories','Orders, Categories'], answer:2, explain:'Customers ile Products arasında Orders ve OrderDetails köprüsü var. Kategori adı için de Categories gerekir.'}
]},

/* ---------------------------------------------------- 11 */
{id:'hepsi', no:'11', title:'Hepsi bir arada', group:'Birleştirme',
body:`
<h3>Yazım sırası</h3>
<pre class="code">SELECT    ne göstereyim
FROM      hangi tablodan
LEFT JOIN ... ON ...     (gerekirse, birkaç tane)
WHERE     hangi satırlar   (gruplamadan önce)
GROUP BY  neye göre grupla
HAVING    hangi gruplar    (gruplamadan sonra)
ORDER BY  nasıl sırala
LIMIT     kaç satır;</pre>
<p>Bu sıra değişmez. Hepsini kullanmak zorunda değilsin ama kullandıklarını bu sırayla yazarsın. WHERE'i GROUP BY'dan sonra yazarsan hata alırsın.</p>
<h3>Sorudaki kelime → SQL</h3>
<div class="tw"><table class="ref"><thead><tr><th>Soruda görürsen</th><th>SQL'de</th></tr></thead><tbody>
<tr><td>ortalama, ort</td><td><code>AVG(...)</code></td></tr>
<tr><td>toplam, kazanç, satış</td><td><code>SUM(...)</code></td></tr>
<tr><td>kaç tane, sayısı</td><td><code>COUNT(...)</code></td></tr>
<tr><td>eşsiz, farklı, tekrarsız</td><td><code>DISTINCT</code></td></tr>
<tr><td>en yüksek / maks, en düşük</td><td><code>MAX(...)</code>, <code>MIN(...)</code></td></tr>
<tr><td>her ... için, ... başına, ...'e göre, kırılımında</td><td><code>GROUP BY ...</code></td></tr>
<tr><td>sırala, büyükten küçüğe (b&gt;k)</td><td><code>ORDER BY ... DESC</code></td></tr>
<tr><td>...'da yaşayan, ...'dan verilen, ... yılında</td><td><code>WHERE ...</code></td></tr>
<tr><td>içinde ... geçen, ... ile başlayan</td><td><code>LIKE '%...%'</code></td></tr>
<tr><td>isimleri ile birlikte</td><td>ismin olduğu tabloyu <code>JOIN</code> ile bağla</td></tr>
<tr><td>... arasında</td><td><code>BETWEEN ... AND ...</code></td></tr>
</tbody></table></div>
<h3>Örnek: soruyu parça parça çevirmek</h3>
<p><b>Soru:</b> <span class="orig">"Çalışanları (employee) isimleri ile birlikte yaptıkları toplam satışlara göre sıralayınız."</span></p>
<ol>
<li><b>isimleri</b> → <code>em.FirstName</code> (Employees)</li>
<li><b>toplam satış</b> → <code>SUM(p.Price)</code> (Products)</li>
<li><b>her çalışanın toplamı</b> → <code>GROUP BY</code> çalışan</li>
<li><b>sıralayınız</b> (en çok satan üstte) → <code>ORDER BY toplam_satis DESC</code></li>
<li><b>yol:</b> Employees ← Orders → OrderDetails → Products</li>
</ol>
<p>Önce sadece JOIN'leri yaz ve <code>SELECT *</code> ile ortaya çıkan büyük tabloya bak:</p>
<pre class="ex">SELECT *
FROM Orders o
LEFT JOIN OrderDetails od ON o.OrderID = od.OrderID
LEFT JOIN Products p ON od.ProductID = p.ProductID
LEFT JOIN Employees em ON o.EmployeeID = em.EmployeeID;</pre>
<p>Sonra grupla, topla, sırala:</p>
<pre class="ex">SELECT em.FirstName, SUM(p.Price) AS toplam_satis
FROM Orders o
LEFT JOIN OrderDetails od ON o.OrderID = od.OrderID
LEFT JOIN Products p ON od.ProductID = p.ProductID
LEFT JOIN Employees em ON o.EmployeeID = em.EmployeeID
GROUP BY em.FirstName
ORDER BY toplam_satis DESC;</pre>
<p class="tip">Çok tablolu her soruda bu iki adımlı yöntemi kullan: önce JOIN'ler + <code>SELECT *</code>, büyük tablo doğru görünüyorsa sonra WHERE/GROUP BY/ORDER BY.</p>
<h3>Neden ORDER BY'da takma ad çalışıyor?</h3>
<p>Veritabanı sorguyu yazdığın sırayla değil şu sırayla işler: FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT. <code>toplam_satis</code> ismi SELECT'te doğuyor; ORDER BY ondan sonra geldiği için ismi tanır. WHERE ve HAVING'de takma ad yerine ifadenin kendisini yaz (<code>HAVING SUM(p.Price) > 100</code>), standart SQL böyle ister.</p>`,
tasks:[
 {q:'Her kategori için ortalama ürün fiyatı, kategori adıyla birlikte.', src:'Hocanın sorusu', sol:`SELECT ca.CategoryName, AVG(p.Price) FROM Products p LEFT JOIN Categories ca ON p.CategoryID = ca.CategoryID GROUP BY ca.CategoryName;`, hint:'Products + Categories, GROUP BY CategoryName'},
 {q:'USA\'da yaşayan müşterilerin kazandırdığı toplam kazanç (hocanın yaptığı gibi <code>SUM(p.Price)</code>).', src:'Hocanın sorusu', sol:`SELECT SUM(p.Price) FROM Orders o LEFT JOIN OrderDetails od ON o.OrderID = od.OrderID LEFT JOIN Products p ON od.ProductID = p.ProductID LEFT JOIN Customers cu ON o.CustomerID = cu.CustomerID WHERE cu.Country = 'USA';`, hint:'Yol: Customers ← Orders → OrderDetails → Products'},
 {q:'Aynı soru, bu sefer gerçek kazanç: fiyat × adet.', sol:`SELECT SUM(p.Price * od.Quantity) FROM Orders o LEFT JOIN OrderDetails od ON o.OrderID = od.OrderID LEFT JOIN Products p ON od.ProductID = p.ProductID LEFT JOIN Customers cu ON o.CustomerID = cu.CustomerID WHERE cu.Country = 'USA';`, hint:'SUM(p.Price * od.Quantity)'},
 {q:'Her müşterinin verdiği sipariş sayısı, müşteri adıyla, çoktan aza.', sol:`SELECT cu.CustomerName, COUNT(o.OrderID) AS n FROM Orders o LEFT JOIN Customers cu ON o.CustomerID = cu.CustomerID GROUP BY cu.CustomerName ORDER BY n DESC;`, ordered:[1], hint:'Orders + Customers, GROUP BY CustomerName, ORDER BY COUNT DESC'},
 {q:'Müşteri ülkelerine göre satılan toplam adet (ülke ve adet), çoktan aza.', sol:`SELECT cu.Country, SUM(od.Quantity) AS adet FROM Orders o LEFT JOIN OrderDetails od ON o.OrderID = od.OrderID LEFT JOIN Customers cu ON o.CustomerID = cu.CustomerID GROUP BY cu.Country ORDER BY adet DESC;`, ordered:[1], hint:'Adet OrderDetails\'te, ülke Customers\'ta, arada Orders.'},
 {q:'En çok satan (toplam adedi en yüksek) 3 ürünün adı ve toplam adedi.', sol:`SELECT p.ProductName, SUM(od.Quantity) AS adet FROM OrderDetails od LEFT JOIN Products p ON od.ProductID = p.ProductID GROUP BY p.ProductName ORDER BY adet DESC LIMIT 3;`, ordered:[1], hint:'GROUP BY ürün, ORDER BY SUM(Quantity) DESC, LIMIT 3'}
]},

/* ---------------------------------------------------- 12 */
{id:'degistirme', no:'12', title:'Tablo oluşturmak ve değiştirmek', group:'Birleştirme',
body:`
<p class="lead">Şimdiye kadar hep <b>okuduk</b> (SELECT). SQL ile tablo oluşturup değiştirebilirsin de. Hocanın "aşağıdakilerden hangisi bölüm alanını tabloya ekleyen kod" sorusu bu konudan.</p>
<p class="aside">Bu sitede her <b>Çalıştır</b>'da veritabanı tertemiz baştan kurulur, yani istediğin kadar silip bozabilirsin. Değişikliği görmek için aynı kutunun sonuna bir SELECT ekle.</p>
<h3>Komutları karıştırma</h3>
<div class="tw"><table class="ref"><thead><tr><th>Komut</th><th>Ne yapar</th></tr></thead><tbody>
<tr><td><code>CREATE TABLE</code></td><td>yeni tablo oluşturur</td></tr>
<tr><td><code>ALTER TABLE ... ADD</code></td><td>var olan tabloya yeni <b>sütun</b> (alan) ekler</td></tr>
<tr><td><code>INSERT INTO</code></td><td>tabloya yeni <b>satır</b> (kayıt) ekler</td></tr>
<tr><td><code>UPDATE ... SET</code></td><td>var olan satırlardaki değeri değiştirir</td></tr>
<tr><td><code>DELETE FROM</code></td><td>satır siler</td></tr>
<tr><td><code>DROP TABLE</code></td><td>tabloyu tamamen siler</td></tr>
</tbody></table></div>
<p>Akılda tutma: <b>sütun/alan</b> ekliyorsan ALTER, <b>satır/kayıt</b> ekliyorsan INSERT.</p>
<h3>ALTER TABLE: sütun eklemek</h3>
<pre class="ex">ALTER TABLE Employees ADD Bolum TEXT;
SELECT * FROM Employees;</pre>
<p>Yeni sütun eklendi ama içi boş (NULL). <code>ADD COLUMN Bolum TEXT</code> diye de yazılır, ikisi aynı. Bazı kaynaklarda <code>VARCHAR(50)</code> görürsün: en fazla 50 karakterlik metin demek.</p>
<h3>Veri tipleri</h3>
<ul><li><code>INTEGER</code> / <code>INT</code>: tam sayı</li><li><code>REAL</code> / <code>DECIMAL</code> / <code>FLOAT</code>: ondalıklı sayı</li><li><code>TEXT</code> / <code>VARCHAR(n)</code>: metin</li><li><code>DATE</code>: tarih</li></ul>
<h3>UPDATE: değer değiştirmek</h3>
<pre class="ex">ALTER TABLE Employees ADD Bolum TEXT;
UPDATE Employees SET Bolum = 'Satis' WHERE EmployeeID = 1;
SELECT * FROM Employees;</pre>
<p><b>WHERE'i unutma.</b> <code>UPDATE Employees SET Bolum = 'Satis';</code> yazarsan herkesin bölümü Satis olur.</p>
<h3>INSERT INTO: satır eklemek</h3>
<pre class="ex">INSERT INTO Shippers (ShipperID, ShipperName, Phone)
VALUES (4, 'Aras Kargo', '444 25 52');
SELECT * FROM Shippers;</pre>
<p>Parantezdeki sütunlar ile VALUES'taki değerler sırayla eşleşir. Bütün sütunlara sırayla değer veriyorsan sütun listesini atlayabilirsin: <code>INSERT INTO Shippers VALUES (4, 'Aras Kargo', '444 25 52');</code></p>
<h3>DELETE: satır silmek</h3>
<pre class="ex">DELETE FROM Shippers WHERE ShipperID = 3;
SELECT * FROM Shippers;</pre>
<p>Yine: WHERE yoksa bütün satırlar silinir.</p>
<h3>CREATE TABLE: yeni tablo</h3>
<pre class="ex">CREATE TABLE Ogrenciler (
  OgrenciID INTEGER PRIMARY KEY,
  Ad TEXT,
  Bolum TEXT
);
INSERT INTO Ogrenciler VALUES (1, 'Ayse', 'Bilgisayar');
INSERT INTO Ogrenciler VALUES (2, 'Mehmet', 'Endustri');
SELECT * FROM Ogrenciler;</pre>
<p><code>PRIMARY KEY</code>: her satırı tek başına tanımlayan sütun, aynı değer iki kere olamaz. CustomerID, ProductID gibi.</p>
<h3>Hocanın 23 Mart dersindeki sıra</h3>
<p>Hoca Colab'da önce bir tablo oluşturup sildi, sonra başka bir tabloya kayıt ekledi:</p>
<pre class="ex">CREATE TABLE deneme(adsoyad varchar(30),
                    numara integer(11));
DROP TABLE deneme;
CREATE TABLE yeni_tablo(adsoyad varchar(30), numara integer(11));
INSERT INTO yeni_tablo VALUES('fatih', '1453');
SELECT * FROM yeni_tablo;</pre>
<p><code>integer(11)</code> "en fazla 11 haneli tam sayı" demek. <code>DROP TABLE</code> tabloyu içindekilerle birlikte tamamen siler; DELETE gibi satır silmez, tablonun kendisini yok eder.</p>
<h3>DB Browser'daki örnekler</h3>
<p>Hocanın DB Browser dosyasında (<code>eyl28.db</code>) iki tablo var. Birincisinde numara otomatik artıyor:</p>
<pre class="ex">CREATE TABLE Deneme1 (
  No INTEGER PRIMARY KEY AUTOINCREMENT,
  Ad TEXT,
  Soyad TEXT
);
INSERT INTO Deneme1 (Ad, Soyad) VALUES ('Ali', 'Kaya');
INSERT INTO Deneme1 (Ad, Soyad) VALUES ('Ayse', 'Demir');
SELECT * FROM Deneme1;</pre>
<p><code>AUTOINCREMENT</code> sayesinde <code>No</code>'yu yazmadık, 1, 2 diye kendisi verdi. İkinci tabloda sütun adlarında <b>boşluk</b> var; böyle adlar çift tırnak (ya da Access'teki gibi köşeli parantez) içinde yazılır:</p>
<pre class="ex">CREATE TABLE Yazgelistir ("Ad Soyad" TEXT, "Kimlik No" INTEGER);
ALTER TABLE Yazgelistir ADD il TEXT;
SELECT * FROM Yazgelistir WHERE 1 = 0;</pre>
<p>Son satır hocanın "sütun adlarını gör" hilesi: tablo boş, ama üç sütunu da görüyorsun.</p>`,
tasks:[
 {mcq:true, src:'Hocanın sorusu', q:'Aşağıdakilerden hangisi <code>Employees</code> tablosuna bölüm (<code>Bolum</code>) alanını ekler?', options:["INSERT INTO Employees (Bolum) VALUES ('Satis');","ALTER TABLE Employees ADD Bolum VARCHAR(50);","UPDATE Employees SET Bolum = 'Satis';","CREATE TABLE Employees (Bolum VARCHAR(50));","SELECT Bolum FROM Employees;"], answer:1, explain:'Alan (sütun) eklemek tablonun yapısını değiştirmek demek: ALTER TABLE. INSERT satır ekler, UPDATE var olan değeri değiştirir (Bolum zaten olmalı), CREATE yeni tablo kurar, SELECT sadece okur.'},
 {q:'<code>Employees</code> tablosuna <code>Bolum</code> adında metin sütunu ekle.', sol:`ALTER TABLE Employees ADD Bolum TEXT;`, verify:`SELECT EmployeeID, Bolum FROM Employees;`, hint:'ALTER TABLE tablo ADD sütun tip;'},
 {q:'<code>Customers</code> tablosuna <code>Telefon</code> adında bir sütun ekle.', sol:`ALTER TABLE Customers ADD Telefon TEXT;`, verify:`SELECT CustomerID, Telefon FROM Customers;`, hint:'ALTER TABLE Customers ADD ...'},
 {q:'<code>Shippers</code> tablosuna ShipperID 4, adı \'Yurtici Kargo\', telefonu \'444 99 99\' olan firmayı ekle.', sol:`INSERT INTO Shippers VALUES (4, 'Yurtici Kargo', '444 99 99');`, verify:`SELECT * FROM Shippers;`, hint:'INSERT INTO Shippers VALUES (...);'},
 {q:'1 numaralı ürünün fiyatını 20 yap.', sol:`UPDATE Products SET Price = 20 WHERE ProductID = 1;`, verify:`SELECT ProductID, Price FROM Products;`, hint:'UPDATE ... SET Price = 20 WHERE ProductID = 1;'},
 {q:'<code>CustomerID</code>\'si 22 olan müşteriyi sil.', sol:`DELETE FROM Customers WHERE CustomerID = 22;`, verify:`SELECT CustomerID FROM Customers;`, hint:'DELETE FROM ... WHERE ...;'},
 {q:'<code>Employees</code>\'a <code>Bolum</code> sütunu ekle, sonra 1, 2 ve 3 numaralı çalışanların bölümünü \'Satis\' yap.', sol:`ALTER TABLE Employees ADD Bolum TEXT; UPDATE Employees SET Bolum = 'Satis' WHERE EmployeeID IN (1, 2, 3);`, verify:`SELECT EmployeeID, Bolum FROM Employees;`, hint:'İki komut alt alta: önce ALTER, sonra UPDATE ... WHERE EmployeeID IN (1, 2, 3);'}
]},

/* ---------------------------------------------------- 13 access */
{id:'access', no:'13', title:'Access dersleri ve UNION', group:'Birleştirme',
body:`
<p class="lead">Dönem başında hoca Access'te (<code>veritabanuygulama.accdb</code>) küçük tablolar üzerinde sorgular kaydetmişti. O tablolar ve sorgular burada da var. Çoğu aynen çalışıyor; birkaç Access'e özel yazımı aşağıda gösterdim.</p>
<h3>Tablolar</h3>
<pre class="ex">SELECT * FROM musteri;</pre>
<pre class="ex">SELECT * FROM siparis;</pre>
<p><code>musteri</code>: müşteri numarası (<code>no</code>), ad soyad, memleket, telefon, bakiye. <code>siparis</code>: hangi müşterinin (<code>no</code>) hangi siparişi verdiği. İki tablo <code>no</code> sütunuyla bağlı. Ayrıca <code>Tablo1</code> (no, adsoyad, memleket), <code>Tablo2</code> (toplam, odenmis, kalan, cinsiyet) ve <code>silin</code> tabloları var.</p>
<p class="aside">Hocanın <code>Tablo1</code>'inde 1 ve 7 numaralı satırlar yoktu (DELETE sorgusuyla silinmişler). DELETE'i deneyebilesin diye buraya memleketi adana olan iki satır koydum. Ayrıca <code>musteri</code> tablosunda <code>bolum</code> ve <code>dogumgunu</code> sütunları başta yok, çünkü hocanın sorguları onları sonradan ALTER ile ekliyor.</p>
<h3>Access'te kayıtlı hesap sorguları</h3>
<p>Sorgu adları hocanın verdiği adlar (avg, count, sum...):</p>
<pre class="ex">SELECT AVG(bakiye) AS ortalama FROM musteri;</pre>
<pre class="ex">SELECT COUNT(adsoyad) FROM musteri;</pre>
<pre class="ex">SELECT SUM([bakiye]) AS toplam FROM musteri;</pre>
<p><code>[bakiye]</code>: Access tablo ve sütun adlarını köşeli parantez içine alır. Ad boşluk ya da Türkçe karakter içeriyorsa zorunlu, değilse isteğe bağlı. Bu sitede de çalışıyor.</p>
<pre class="ex">SELECT musteri.*
FROM musteri
WHERE musteri.bakiye BETWEEN 3001 AND 6000;</pre>
<p><code>musteri.*</code> "musteri tablosunun bütün sütunları" demek. Tek tablo varken <code>*</code> ile aynı.</p>
<pre class="ex">SELECT musteri.[no], *
FROM musteri
ORDER BY musteri.[adsoyad];</pre>
<p>Önce <code>no</code>, sonra bütün sütunlar (no iki kere görünür), ada göre sıralı.</p>
<pre class="ex">SELECT Tablo2.*, [Tablo2].[toplam] * 2 AS kalan
FROM Tablo2;</pre>
<h3>INNER JOIN ve LEFT JOIN, küçük tabloda</h3>
<p>7 müşteri var ama sadece 3'ünün siparişi var. Fark burada çok net görünüyor:</p>
<pre class="ex">SELECT musteri.no, musteri.adsoyad, musteri.bakiye, siparis.siparisno, siparis.ürün, siparis.kargoteslim, siparis.tarih
FROM musteri INNER JOIN siparis ON musteri.no = siparis.no;</pre>
<pre class="ex">SELECT musteri.adsoyad, siparis.siparisno
FROM musteri LEFT JOIN siparis ON musteri.[no] = siparis.[no]
ORDER BY musteri.adsoyad;</pre>
<p>INNER: 3 satır (sadece siparişi olanlar). LEFT: 7 satır, siparişi olmayanların siparisno'su NULL.</p>
<h3>UNION: iki sorgunun sonucunu alt alta koymak</h3>
<p>JOIN tabloları <b>yan yana</b> koyar. UNION ise iki SELECT'in sonucunu <b>alt alta</b> ekler. Hocanın <code>Sorgu1</code>'i:</p>
<pre class="ex">SELECT no, adsoyad, tel FROM musteri
UNION
SELECT siparisno, ürün, kargoteslim FROM siparis;</pre>
<ul>
<li>İki SELECT'te <b>sütun sayısı aynı</b> olmalı (burada ikisinde de 3).</li>
<li>Sütun adları birinci SELECT'ten gelir. O yüzden ürün adları "adsoyad" başlığının altında görünüyor; UNION anlamla ilgilenmez, sırayla eşler.</li>
<li><code>UNION</code> tekrar eden satırları atar. Tekrarları da istiyorsan <code>UNION ALL</code>.</li>
</ul>
<pre class="ex">SELECT memleket FROM musteri
UNION
SELECT memleket FROM Tablo1;</pre>
<p>İki tablodaki bütün memleketler, her biri bir kez. <code>UNION ALL</code> yazıp farkı gör.</p>
<h3>Yapıyı değiştiren sorgular (hocanın sırasıyla)</h3>
<p>Hoca bunları Access'te tek tek kaydetmişti. Bu kutu temiz veritabanında baştan sona çalışır:</p>
<pre class="ex">-- create: yeni tablo
CREATE TABLE deneme(
  no Long PRIMARY KEY,
  adsoyad Text(70),
  memleket Text(70)
);
-- alter: deneme tablosuna telefon alanı
ALTER TABLE deneme ADD tel varchar(20);
-- ADDkomutu: musteri tablosuna bölüm alanı
ALTER TABLE musteri ADD bolum char(15);
-- updatekomutu: samsunluların bölümü
UPDATE musteri SET bolum = 'cografya' WHERE memleket = 'samsun';
-- tarihalanıekle: tarih tipinde alan
ALTER TABLE musteri ADD dogumgunu DATE;
SELECT * FROM musteri;</pre>
<p><code>bolum</code> sadece samsunlularda dolu, diğerleri NULL. <code>dogumgunu</code> herkesde boş.</p>
<pre class="ex">-- sütun silme (sütunsilmealterdrop)
ALTER TABLE musteri ADD deneme char(15);
ALTER TABLE musteri DROP deneme;
SELECT * FROM musteri WHERE 1 = 0;</pre>
<p><code>ALTER TABLE ... DROP sütun</code> sütunu siler (<code>DROP COLUMN</code> diye de yazılır). <code>DROP TABLE</code> ise tablonun tamamını siler, karıştırma.</p>
<pre class="ex">-- insert
INSERT INTO silin VALUES (22, 'istatistik bölümü', 'Samsun');
-- delete (Access'te: DELETE * FROM tablo1 WHERE memleket='adana';)
DELETE FROM Tablo1 WHERE memleket = 'adana';
SELECT * FROM silin;
SELECT * FROM Tablo1;</pre>
<pre class="ex">-- drop: silin tablosunu tamamen kaldır
DROP TABLE silin;
SELECT name FROM sqlite_master WHERE type = 'table';</pre>
<h3>Access ile buradaki SQL arasındaki farklar</h3>
<div class="tw"><table class="ref"><thead><tr><th>Access'te</th><th>Standart SQL / SQLite</th></tr></thead><tbody>
<tr><td><code>DELETE * FROM tablo1 WHERE ...</code></td><td><code>DELETE FROM tablo1 WHERE ...</code> (yıldız yok)</td></tr>
<tr><td><code>[musteri].[adsoyad]</code></td><td><code>musteri.adsoyad</code> (köşeli parantez burada da çalışır)</td></tr>
<tr><td><code>Long</code>, <code>Text(70)</code></td><td><code>INTEGER</code>, <code>VARCHAR(70)</code> / <code>TEXT</code></td></tr>
<tr><td><code>char(15)</code> değeri 15 karaktere boşlukla tamamlar (<code>'matematik      '</code>)</td><td><code>VARCHAR</code> / <code>TEXT</code> tamamlamaz</td></tr>
<tr><td>Boş tabloya <code>ADD tel varchar(20) NOT NULL</code> olur</td><td>SQLite'ta <code>NOT NULL DEFAULT ''</code> ister</td></tr>
<tr><td><code>SELECT DISTINCTROW</code></td><td>Access'e özel; <code>SELECT DISTINCT</code> kullan</td></tr>
</tbody></table></div>`,

{id:'teori', no:'14', title:'Teori: kavramlar ve açılımlar', group:'Teori ve ileri SQL',
body:`
<p class="lead">Hocanın ders planındaki (vertabprogders) teorik kısım. Hocanın son derste söyledikleri: <b>kelime açılımları sorulabilir</b>, <b>DDL / DML / DCL açılımları kesin soru</b>.</p>
<h3>Açılım kartları</h3>
<p>Kısaltmaya bak, açılımını kafandan söyle, sonra karta tıklayıp kontrol et. Sınavdan önce birkaç tur yap.</p>
<div class="flashes">
<details class="flash"><summary>SQL</summary><b>Structured Query Language</b><span>Yapılandırılmış Sorgu Dili</span></details>
<details class="flash"><summary>DBMS</summary><b>Database Management System</b><span>Veritabanı Yönetim Sistemi</span></details>
<details class="flash"><summary>RDBMS</summary><b>Relational Database Management System</b><span>İlişkisel Veritabanı Yönetim Sistemi</span></details>
<details class="flash"><summary>DDL</summary><b>Data Definition Language</b><span>Veri Tanımlama Dili · CREATE, ALTER, DROP</span></details>
<details class="flash"><summary>DML</summary><b>Data Manipulation Language</b><span>Veri İşleme Dili · INSERT, UPDATE, DELETE, SELECT</span></details>
<details class="flash"><summary>DCL</summary><b>Data Control Language</b><span>Veri Kontrol Dili · GRANT, REVOKE</span></details>
<details class="flash"><summary>TCL</summary><b>Transaction Control Language</b><span>İşlem Kontrol Dili · BEGIN, COMMIT, ROLLBACK</span></details>
<details class="flash"><summary>PK</summary><b>Primary Key</b><span>Birincil Anahtar</span></details>
<details class="flash"><summary>FK</summary><b>Foreign Key</b><span>Yabancı Anahtar</span></details>
<details class="flash"><summary>1NF · 2NF · 3NF</summary><b>First / Second / Third Normal Form</b><span>Birinci / İkinci / Üçüncü Normal Form</span></details>
<details class="flash"><summary>CRUD</summary><b>Create, Read, Update, Delete</b><span>Oluştur, Oku, Güncelle, Sil</span></details>
<details class="flash"><summary>ACID</summary><b>Atomicity, Consistency, Isolation, Durability</b><span>Bölünmezlik, Tutarlılık, Yalıtım, Kalıcılık</span></details>
<details class="flash"><summary>NoSQL</summary><b>Not Only SQL</b><span>Sadece SQL değil (ilişkisel olmayan veritabanları)</span></details>
<details class="flash"><summary>DESC / ASC</summary><b>Descending / Ascending</b><span>Azalan (büyükten küçüğe) / Artan</span></details>
<details class="flash"><summary>VARCHAR</summary><b>Variable Character</b><span>Değişken uzunluklu metin (CHAR: sabit uzunluk)</span></details>
</div>
<h3>DDL, DML, DCL: kesin soru</h3>
<p>SQL komutları ne iş yaptıklarına göre gruplara ayrılır. Ayırmanın en kolay yolu: komut <b>tablonun kendisini</b> mi değiştiriyor, yoksa <b>içindeki veriyi</b> mi?</p>
<div class="tw"><table class="ref"><thead><tr><th>Grup</th><th>Açılımı</th><th>Ne yapar</th><th>Komutlar</th></tr></thead><tbody>
<tr><td><b>DDL</b></td><td>Data Definition Language<br><span class="src">Veri Tanımlama Dili</span></td><td>Tablonun <b>yapısını</b> kurar, değiştirir, siler</td><td><code>CREATE</code>, <code>ALTER</code>, <code>DROP</code></td></tr>
<tr><td><b>DML</b></td><td>Data Manipulation Language<br><span class="src">Veri İşleme Dili</span></td><td>Tablonun içindeki <b>veriyi</b> ekler, değiştirir, siler, okur</td><td><code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code>, <code>SELECT</code></td></tr>
<tr><td><b>DCL</b></td><td>Data Control Language<br><span class="src">Veri Kontrol Dili</span></td><td>Kimin neye <b>erişebileceğini</b> belirler</td><td><code>GRANT</code> (yetki ver), <code>REVOKE</code> (yetkiyi geri al)</td></tr>
</tbody></table></div>
<p>Tuzak çift: <code>DROP</code> (DDL) tabloyu yok eder, <code>DELETE</code> (DML) tablonun içindeki satırları siler, tablo kalır. <code>ALTER</code> (DDL) sütun ekler/siler, <code>UPDATE</code> (DML) değer değiştirir.</p>
<p class="aside">Bazı kaynaklar iki grup daha sayar: SELECT'i ayrı tutan <b>DQL</b> (Data Query Language, Veri Sorgulama Dili) ve BEGIN/COMMIT/ROLLBACK için <b>TCL</b> (Transaction Control Language). Hocanın ders notunda SELECT, DML'in içinde sayılıyor; sınavda notu esas al.</p>
<h3>Veritabanı ve DBMS</h3>
<ul>
<li><b>Veritabanı:</b> verilerin düzenli saklandığı ve yönetildiği yapı.</li>
<li><b>DBMS</b> (Veritabanı Yönetim Sistemi): veritabanını oluşturmak, yönetmek ve kullanmak için yazılım. İlişkisel olanlar (<b>RDBMS</b>): MySQL, PostgreSQL, SQL Server, Oracle, SQLite (bu site ve Colab). NoSQL olanlar: MongoDB, Cassandra, Firebase.</li>
<li><b>Dosya tabanlı sisteme göre avantajları:</b> veri tekrarı azalır, güvenlik ve yetkilendirme vardır, veri bütünlüğü korunur, aynı anda birçok kullanıcı çalışabilir, veriye hızlı erişilir.</li>
</ul>
<h3>Tablo, satır, sütun</h3>
<p><b>Tablo</b> (table) = satır ve sütunlardan oluşan yapı. <b>Satır</b> = kayıt (row, record). <b>Sütun</b> = alan (column, field). Sınavda "kayıt" görürsen satır, "alan" görürsen sütun.</p>
<h3>Anahtarlar: PK ve FK</h3>
<ul>
<li><b>Birincil anahtar (Primary Key):</b> her satırı tek başına tanımlayan sütun. <b>Tekrar edemez, boş (NULL) olamaz.</b> Northwind'de <code>Customers.CustomerID</code>, <code>Orders.OrderID</code>.</li>
<li><b>Yabancı anahtar (Foreign Key):</b> başka bir tablonun birincil anahtarına başvuran sütun. Tabloları birbirine bağlar. <code>Orders.CustomerID</code>, Customers'ın PK'sına başvuran bir FK'dir.</li>
</ul>
<p>Yani JOIN'lerde <code>ON</code>'a yazdığın şey hep "FK = PK": <code>o.CustomerID = cu.CustomerID</code>. 15. konuda FOREIGN KEY'in yanlış veriyi nasıl engellediğini çalıştırarak göreceksin.</p>
<h3>İlişki türleri</h3>
<div class="tw"><table class="ref"><thead><tr><th>Tür</th><th>Anlamı</th><th>Örnek</th></tr></thead><tbody>
<tr><td><b>Bire bir</b> (1-1, One-to-One)</td><td>Bir kayda karşı en fazla bir kayıt</td><td>Bir öğrenci ↔ bir öğrenci kimlik kartı</td></tr>
<tr><td><b>Bire çok</b> (1-N, One-to-Many)</td><td>Bir kayda karşı birden çok kayıt</td><td>Bir müşteri → birçok sipariş (Customers → Orders)</td></tr>
<tr><td><b>Çoktan çoğa</b> (N-N, Many-to-Many)</td><td>İki tarafta da birden çok</td><td>Bir siparişte birçok ürün, bir ürün birçok siparişte (Orders ↔ Products)</td></tr>
</tbody></table></div>
<p>Çoktan çoğa ilişki doğrudan kurulamaz, arada bir <b>ara tablo</b> gerekir. Northwind'deki <code>OrderDetails</code> tam olarak bu: Orders ile Products arasındaki köprü. 10. konuda "neden hep OrderDetails'ten geçiyoruz" sorusunun cevabı bu.</p>
<h3>Normalizasyon</h3>
<p><b>Normalizasyon:</b> veri tekrarını azaltmak ve tutarlılığı artırmak için tabloları mantıklı parçalara bölmek. Kötü tasarlanmış bir tablo düşün:</p>
<div class="tw"><table class="ref"><thead><tr><th>OgrNo</th><th>Ad</th><th>BolumKodu</th><th>BolumAdi</th><th>Dersler</th></tr></thead><tbody>
<tr><td>1</td><td>Ali</td><td>IST</td><td>İstatistik</td><td>Matematik, Fizik</td></tr>
<tr><td>2</td><td>Ayşe</td><td>IST</td><td>İstatistik</td><td>Matematik</td></tr>
</tbody></table></div>
<ul>
<li><b>1NF</b> (Birinci Normal Form): <b>her hücrede tek değer</b>, tekrar eden grup yok. "Matematik, Fizik" hücresi 1NF'yi bozuyor. Çözüm: her ders ayrı satır (ya da ayrı bir kayıt tablosu).</li>
<li><b>2NF</b>: 1NF + her sütun anahtarın <b>tamamına</b> bağlı. Anahtar (OgrNo, DersKodu) ikilisiyse, "Ad" sadece OgrNo'ya bağlıdır, bu kısmi bağımlılık 2NF'yi bozar. Çözüm: öğrenci bilgisi ayrı tablo.</li>
<li><b>3NF</b>: 2NF + sütunlar anahtar dışındaki <b>başka bir sütuna</b> bağlı değil. BolumAdi, OgrNo'ya değil BolumKodu'na bağlı (geçişli bağımlılık). Çözüm: ayrı <code>Bolumler(BolumKodu, BolumAdi)</code> tablosu.</li>
</ul>
<p><b>Anomaliler</b> (normalizasyon yapılmazsa çıkan sorunlar), yukarıdaki tablo üzerinden:</p>
<ul>
<li><b>Güncelleme (update) anomalisi:</b> bölümün adı değişirse, o bölümdeki her öğrencinin satırını tek tek değiştirmen gerekir. Birini unutursan veri tutarsız olur.</li>
<li><b>Ekleme (insertion) anomalisi:</b> henüz öğrencisi olmayan yeni bir bölümü ekleyemezsin, çünkü bölüm bilgisi öğrenci satırının içinde.</li>
<li><b>Silme (deletion) anomalisi:</b> bölümdeki son öğrenciyi silersen bölümün bilgisi de kaybolur.</li>
</ul>
<p>Northwind normalize edilmiş bir veritabanı: kategori adı her ürünün yanında tekrar yazılmıyor, ayrı <code>Categories</code> tablosunda bir kere duruyor. JOIN yapmak zorunda kalmamızın sebebi bu.</p>
<h3>İndeks</h3>
<p>Kitabın sonundaki dizin gibi: aranan değeri bütün tabloyu taramadan bulmayı sağlar. <code>CREATE INDEX idx_ad ON tablo(sutun);</code> Faydası: arama, sıralama, JOIN hızlanır. Bedeli: her INSERT/UPDATE/DELETE'te indeks de güncellendiği için yazma işlemleri yavaşlar ve yer kaplar. O yüzden sadece sık aranan sütunlara konur.</p>
<h3>Transaction (işlem) ve ACID</h3>
<p>Birkaç komutun <b>ya hep birlikte ya hiç</b> çalışması. Klasik örnek banka havalesi: bir hesaptan para düşülür, diğerine eklenir; arada hata olursa ikisi de geri alınmalı.</p>
<ul><li><code>BEGIN</code> başlatır, <code>COMMIT</code> kalıcı yapar, <code>ROLLBACK</code> geri alır.</li>
<li><b>ACID</b>: <b>A</b>tomicity (bölünmezlik, ya hep ya hiç), <b>C</b>onsistency (tutarlılık), <b>I</b>solation (yalıtım, aynı anda çalışan işlemler birbirini bozmaz), <b>D</b>urability (kalıcılık, COMMIT edilen veri kaybolmaz).</li></ul>
<h3>Trigger ve stored procedure</h3>
<ul><li><b>Tetikleyici (trigger):</b> bir tabloda INSERT, UPDATE ya da DELETE olunca <b>kendiliğinden</b> çalışan kod. Örnek: satış eklenince stok miktarını otomatik düşürmek.</li>
<li><b>Saklı yordam (stored procedure):</b> veritabanında saklanan, adıyla çağrılan hazır SQL kod bloğu. <b>Fonksiyon</b> bir değer döndürür, prosedür bir işi yapar.</li></ul>
<h3>NoSQL</h3>
<p>İlişkisel olmayan veritabanları. Sabit tablo şeması yok, esnek veri yapısı ve yüksek ölçeklenebilirlik var. İlişkisel veritabanı yapılandırılmış veri ve ACID için, NoSQL büyük ve yapılandırılmamış veri için tercih edilir.</p>
<div class="tw"><table class="ref"><thead><tr><th>Tür</th><th>Veriyi nasıl tutar</th><th>Örnek</th></tr></thead><tbody>
<tr><td>Anahtar-değer (Key-Value)</td><td>anahtar → değer çiftleri</td><td>Redis</td></tr>
<tr><td>Belge (Document)</td><td>JSON/BSON belgeleri</td><td>MongoDB</td></tr>
<tr><td>Kolon tabanlı (Column-Family)</td><td>sütun aileleri</td><td>Cassandra</td></tr>
<tr><td>Grafik (Graph)</td><td>düğümler ve kenarlar</td><td>Neo4j (sosyal ağlar)</td></tr>
</tbody></table></div>
<h3>Güvenlik, yedekleme, optimizasyon</h3>
<ul>
<li><b>SQL enjeksiyonu (SQL injection):</b> saldırganın bir giriş kutusuna SQL kodu yazıp sorguyu değiştirmesi. Örnek: kullanıcı adı yerine <code>' OR '1'='1</code> yazılırsa <code>WHERE ad = '' OR '1'='1'</code> her zaman doğru olur. Korunma: <b>parametreli sorgular / hazırlanmış ifadeler (prepared statements)</b> ve giriş doğrulama.</li>
<li><b>Yetkilendirme:</b> kullanıcıya sadece ihtiyacı olan yetkiyi ver (GRANT/REVOKE, yani DCL).</li>
<li><b>Yedekleme türleri:</b> <b>tam</b> (her şey), <b>fark</b> (son tam yedekten beri değişenler), <b>artımlı</b> (son yedekten, hangisi olursa, beri değişenler).</li>
<li><b>Optimizasyon:</b> doğru indeks, gereksiz veri çekmemek (<code>SELECT *</code> yerine gereken sütunlar), sık kullanılan veriyi <b>önbelleğe (cache)</b> almak.</li>
</ul>`,

/* ---------------------------------------------------- 15 ileri */
{id:'ileri', no:'15', title:'Alt sorgular ve ileri SQL', group:'Teori ve ileri SQL',
body:`
<p class="lead">Ders planının uygulamalı kısmında olup önceki konularda olmayanlar: alt sorgular, RIGHT ve FULL JOIN, metin ve tarih fonksiyonları, indeks, transaction, FOREIGN KEY. Hepsi burada çalışıyor.</p>
<h3>Alt sorgu: sorgunun içinde sorgu</h3>
<p>Bazen bir koşulun değeri önceden belli değildir. "Ortalama fiyattan pahalı ürünler" sorusunda ortalamayı önce bulmak gerekir. İçteki sorgu parantez içinde yazılır ve <b>önce o çalışır</b>.</p>
<p>Önce içteki sorguyu tek başına çalıştır:</p>
<pre class="ex">SELECT AVG(Price) FROM Products;</pre>
<p>Şimdi onu bir koşulun içine koy:</p>
<pre class="ex">SELECT ProductName, Price
FROM Products
WHERE Price > (SELECT AVG(Price) FROM Products);</pre>
<p>Veritabanı önce parantezin içini hesaplar (yaklaşık 39.16), sonra sorguyu <code>WHERE Price > 39.16</code> gibi çalıştırır. Bu <b>tek sonuç döndüren</b> alt sorgu: bir satır, bir sütun. Bu yüzden <code>&gt;</code>, <code>=</code>, <code>&lt;</code> ile kullanılabilir.</p>
<p>Klasik soru, "en pahalı ürünün adı":</p>
<pre class="ex">SELECT ProductName, Price
FROM Products
WHERE Price = (SELECT MAX(Price) FROM Products);</pre>
<h3>Çok sonuç döndüren alt sorgu: IN</h3>
<p>İçteki sorgu birden çok değer döndürüyorsa <code>=</code> yerine <code>IN</code> kullanılır. "Beverages kategorisindeki ürünler":</p>
<pre class="ex">SELECT ProductName
FROM Products
WHERE CategoryID IN (SELECT CategoryID FROM Categories WHERE CategoryName = 'Beverages');</pre>
<p>Bu sorgu, 9. konuda JOIN ile yazdığımız sorguyla aynı sonucu verir. Aynı soru çoğu zaman ya JOIN ya alt sorguyla çözülebilir; ikisi de doğru.</p>
<p><code>NOT IN</code> ile "hiç sipariş vermemiş müşteriler":</p>
<pre class="ex">SELECT CustomerName
FROM Customers
WHERE CustomerID NOT IN (SELECT CustomerID FROM Orders);</pre>
<h3>EXISTS</h3>
<p><code>EXISTS</code> alt sorgunun <b>en az bir satır döndürüp döndürmediğine</b> bakar. Döndürüyorsa koşul doğru olur. "En az bir siparişi olan müşteriler":</p>
<pre class="ex">SELECT cu.CustomerName
FROM Customers cu
WHERE EXISTS (SELECT 1 FROM Orders o WHERE o.CustomerID = cu.CustomerID);</pre>
<p>İçteki sorgu dışarıdaki her müşteri için ayrı ayrı çalışır (<code>cu.CustomerID</code>'yi dışarıdan alıyor). <code>SELECT 1</code> yazılmasının sebebi şu: ne döndürdüğü önemli değil, sadece satır olup olmadığına bakılıyor.</p>
<h3>ANY ve ALL</h3>
<ul><li><code>&gt; ALL (alt sorgu)</code>: alt sorgudaki <b>bütün</b> değerlerden büyük.</li>
<li><code>&gt; ANY (alt sorgu)</code>: alt sorgudaki değerlerden <b>en az birinden</b> büyük.</li></ul>
<p>Ders notundaki örnek: <code>WHERE fiyat &gt; ALL (SELECT fiyat FROM ürünler WHERE kategori_id = 2)</code>, yani kategori 2'deki bütün ürünlerden pahalı olanlar. Bu veritabanı (SQLite) ANY/ALL'u tanımıyor, ama aynı anlamı MAX ve MIN ile yazabilirsin:</p>
<div class="tw"><table class="ref"><tbody>
<tr><td><code>&gt; ALL (SELECT x ...)</code></td><td>=</td><td><code>&gt; (SELECT MAX(x) ...)</code></td></tr>
<tr><td><code>&gt; ANY (SELECT x ...)</code></td><td>=</td><td><code>&gt; (SELECT MIN(x) ...)</code></td></tr>
</tbody></table></div>
<pre class="ex">SELECT ProductName, Price
FROM Products
WHERE Price > (SELECT MAX(Price) FROM Products WHERE CategoryID = 2);</pre>
<h3>Dört JOIN türü</h3>
<p>Ders notunda dördü de var. Farkı küçük tablolarla görmek için Access dersindeki <code>musteri</code> ve <code>siparis</code> tablolarını kullanalım. Önce siparis'e müşterisi olmayan bir kayıt ekliyoruz (no = 99), sonra dört türü çalıştırıp satır sayılarını karşılaştır:</p>
<pre class="ex">INSERT INTO siparis VALUES (99, 113, 'kalem', 'izmir', '2.05.2021');

SELECT m.adsoyad, s.ürün FROM musteri m INNER JOIN siparis s ON m.no = s.no;
SELECT m.adsoyad, s.ürün FROM musteri m LEFT JOIN siparis s ON m.no = s.no;
SELECT m.adsoyad, s.ürün FROM musteri m RIGHT JOIN siparis s ON m.no = s.no;
SELECT m.adsoyad, s.ürün FROM musteri m FULL OUTER JOIN siparis s ON m.no = s.no;</pre>
<div class="tw"><table class="ref"><thead><tr><th>Tür</th><th>Hangi satırlar kalır</th><th>Burada</th></tr></thead><tbody>
<tr><td><code>INNER JOIN</code></td><td>Sadece iki tarafta da eşi olanlar</td><td>3 satır</td></tr>
<tr><td><code>LEFT JOIN</code></td><td>Soldakilerin hepsi + eşleşenler</td><td>7 satır (siparişsiz müşteriler NULL)</td></tr>
<tr><td><code>RIGHT JOIN</code></td><td>Sağdakilerin hepsi + eşleşenler</td><td>4 satır (kalemin müşterisi NULL)</td></tr>
<tr><td><code>FULL OUTER JOIN</code></td><td>İki taraftakilerin hepsi</td><td>8 satır</td></tr>
</tbody></table></div>
<p><code>A RIGHT JOIN B</code>, <code>B LEFT JOIN A</code> ile aynı şeydir; sadece tabloların yeri değişir. O yüzden pratikte çoğu kişi hep LEFT JOIN yazar.</p>
<h3>Metin ve tarih fonksiyonları</h3>
<pre class="ex">SELECT FirstName,
       UPPER(FirstName) AS buyuk,
       LOWER(LastName) AS kucuk,
       FirstName || ' ' || LastName AS tam_ad,
       CONCAT(FirstName, ' ', LastName) AS tam_ad2,
       LENGTH(LastName) AS uzunluk
FROM Employees;</pre>
<ul><li><code>UPPER</code> büyük harfe, <code>LOWER</code> küçük harfe çevirir.</li>
<li><code>CONCAT(a, b)</code> metinleri birleştirir. SQLite'ta <code>a || b</code> de aynı işi görür.</li>
<li><code>LENGTH</code> karakter sayısını verir.</li></ul>
<pre class="ex">SELECT DATE('now') AS bugun, DATETIME('now') AS simdi;</pre>
<p>Ders notundaki <code>NOW()</code> MySQL'in fonksiyonu; SQLite'taki karşılığı <code>DATETIME('now')</code>.</p>
<h3>İndeks oluşturmak</h3>
<pre class="ex">CREATE INDEX idx_musteri_adi ON Customers(CustomerName);
SELECT name, tbl_name FROM sqlite_master WHERE type = 'index';</pre>
<p>Kalıp: <code>CREATE INDEX indeks_adi ON tablo(sütun);</code>. Sonuç değişmez, sadece o sütunda arama hızlanır. Silmek için <code>DROP INDEX idx_musteri_adi;</code>.</p>
<h3>Transaction: BEGIN, COMMIT, ROLLBACK</h3>
<p>Aşağıda bütün kargo firmalarını siliyoruz, ama ROLLBACK ile geri alıyoruz. Son SELECT'te firmaların hâlâ yerinde durduğunu göreceksin:</p>
<pre class="ex">BEGIN;
DELETE FROM Shippers;
SELECT COUNT(*) AS silindikten_sonra FROM Shippers;
ROLLBACK;
SELECT COUNT(*) AS rollback_sonrasi FROM Shippers;</pre>
<p><code>ROLLBACK</code> yerine <code>COMMIT</code> yazarsan silme kalıcı olur. Dene.</p>
<h3>FOREIGN KEY: yanlış veriyi engellemek</h3>
<p>Ders notundaki örnek. <code>dersler.OgrenciID</code>, <code>ogrenciler.ID</code>'ye başvuran bir yabancı anahtar. Var olmayan bir öğrenciye (99) ders eklemeye çalış:</p>
<pre class="ex">PRAGMA foreign_keys = ON;
CREATE TABLE ogrenciler (ID INT PRIMARY KEY, Ad VARCHAR(50), Soyad VARCHAR(50), Yas INT);
CREATE TABLE dersler (
  DersID INT PRIMARY KEY,
  DersAdi VARCHAR(50),
  OgrenciID INT,
  FOREIGN KEY (OgrenciID) REFERENCES ogrenciler(ID)
);
INSERT INTO ogrenciler VALUES (1, 'Ali', 'Kaya', 22);
INSERT INTO dersler VALUES (10, 'Matematik', 1);
INSERT INTO dersler VALUES (11, 'Fizik', 99);</pre>
<p><b>FOREIGN KEY constraint failed</b> hatası: 99 numaralı öğrenci yok, veritabanı bu kaydı kabul etmiyor. Veri bütünlüğü budur. (İlk satırdaki PRAGMA, SQLite'ta bu kontrolü açar; MySQL gibi sistemlerde varsayılan olarak açıktır.) Son satırı silip <code>SELECT * FROM dersler;</code> yazarsan geçerli kaydı görürsün.</p>
<h3>DESC'in iki anlamı</h3>
<ul><li><code>ORDER BY Price DESC</code>: büyükten küçüğe sırala (descending). Sınavda en çok bu çıkar; ASC varsayılan olduğu için büyükten küçüğe isteniyorsa DESC'i yazmayı unutma.</li>
<li>MySQL'de <code>DESC Customers;</code> (DESCRIBE) tablonun sütunlarını ve tiplerini gösterir. SQLite'ta bu komut yok; karşılığı aşağıda:</li></ul>
<pre class="ex">PRAGMA table_info(Customers);</pre>`,
tasks:[
 {q:'Ortalama fiyattan pahalı olan ürünlerin adı ve fiyatı.', sol:`SELECT ProductName, Price FROM Products WHERE Price > (SELECT AVG(Price) FROM Products);`, hint:'WHERE Price > (SELECT AVG(Price) FROM Products)'},

body:`
<p class="lead">Hocanın derste verdiği soruların hepsi burada, notlardaki sırayla. Önce kendin çöz ve <b>Kontrol et</b>'e bas. Sonra <b>Hocanın çözümü ve notlar</b>'ı aç.</p>
<p class="aside">Ders notundaki bazı çözümler aceleyle yazılmış ve küçük hatalar var (eksik yıldız, kapanmamış parantez, <code>Product</code> yerine <code>Products</code> gibi). Her birinin nerede olduğunu notlarda yazdım. Sınavda bu hataları sen yapma.</p>`,
tasks:[
 {date:'2.11.2026', q:'orders tablosunda kaç müşteri olduğunu bul', lesson:'fonksiyon',
  teacher:`SELECT COUNT(CustomerID) FROM Orders;`, note:`Doğru çalışır, ama bu aslında <b>sipariş</b> sayısı: aynı müşteri her siparişinde tekrar sayılır. Bir sonraki soru farkı gösteriyor.`,

  teacher:`SELECT FROM Customers WHERE Country in ('Brazil','USA');`, note:'SELECT ile FROM arası boş kalmış, ne istendiği yazılmamış. <code>SELECT *</code> olmalı.',

 {date:'2.11.2026', q:'Önce ülkeye sonra şehre göre group by işlem yapıp bu kırılımda müşteri sayısını bulunuz', lesson:'grup',
  teacher:`SELECT COUNT(CustomerID, Country, City FROM Customers GROUP BY Country, City;`, note:'COUNT\'un parantezi yanlış yerde: sadece saydığın sütunu sarmalı. <code>COUNT(CustomerID), Country, City</code>.',

 {date:'2.11.2026', q:'Müşteri adreslerinin herhangi bir yerinde "da" ifadesi geçen tüm adresleri bulma', lesson:'like',
  teacher:`SELECT * FROM products WHERE ProductName LIKE '%ha%'`, note:'Bu hücreye derste gösterilen örnek kopyalanmış, soruyla ilgisi yok. Soru Customers tablosundaki adresleri istiyor.',

 {date:'2.11.2026', q:'Germany-Berlinde yaşayan müşterilerin isimleri', lesson:'mantik',
  teacher:`SELECT CustomerName FROM Customers WHERE Country = 'Germany' and City = 'Berlin'`, note:'Doğru. <code>and</code> küçük harf olması fark etmez.',
